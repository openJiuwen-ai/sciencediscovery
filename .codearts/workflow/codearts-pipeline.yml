concurrency:
  max: 5
  enable: false
  preemption:
    enable: false
    events:
    - mr_id
  exceed-action: IGNORE
sources:
  sciencediscovery:
    type: gitcode
    name: sciencediscovery
    branch: ci/verify-pr-ci
    git_url: https://gitcode.com/openJiuwen/sciencediscovery.git
    ssh_git_url: git@gitcode.com:openJiuwen/sciencediscovery.git
    endpoint_id: c4451a2a11af48baacd6b2af5eee3075
    repo_id: 10597680
on:
  sources:
    sciencediscovery:
      merge_requests:
        branches:
        - ci/verify-pr-ci
        paths: []
        types:
        - open
        - update
        - reopen
        branches-ignore: []
        paths-ignore: []
        code-update: false
        merge_comment: rerun
inputs:
  PR_ID:
    type: string
    default: "${MERGE_ID}"
    manual_override: true
  HUAWEICLOUD_NPM_REGISTRY:
    type: string
    default: https://repo.huaweicloud.com/repository/npm/
    manual_override: false
  HUAWEICLOUD_PYPI_INDEX:
    type: string
    default: https://repo.huaweicloud.com/repository/pypi/simple
    manual_override: false
  NPMMIRROR_PYTHON_INSTALL_MIRROR:
    type: string
    default: https://registry.npmmirror.com/-/binary/python-build-standalone
    manual_override: false
  MICROMAMBA_CONDA_MIRROR:
    type: string
    default: https://mirrors.tuna.tsinghua.edu.cn/anaconda/cloud/conda-forge
    manual_override: false
  CI_BINARY_CACHE_URL:
    type: string
    default: https://openjiuwen-ci.obs.cn-north-4.myhuaweicloud.com/sciencediscovery/cache/toolchains/v1
    manual_override: false
stages:
  176464703972462e4780d-56ca-4c54-9c49-29291c471dfd:
    jobs:
      create_label:
        select: selected_by_default
        name: Mark PR checks as running
        needs: []
        steps:
        - name: Create the running label
          uses: official_devcloud_cloudBuild
          with:
            number: "${MERGE_ID}"
            WEBHOOK_PAYLOAD: "${WEBHOOK_PAYLOAD}"
            __sameProject__: "true"
            __projectId__: ""
            jobId: dc2f05de339b410a972184a84b9f1c6f
            __repository__: sciencediscovery
            artifactIdentifier: ""
          identifier: 17736446667235cd01d5c-c29e-41f5-ab85-52bba5fce5ed
        if: "${{ sources.sciencediscovery.merge_id != '' }}"
        runs-on:
        - default
    pre:
    - type: auto
    name: Prepare PR
    select: selected_by_default
    fail-fast: false
  1787542687692903221df-b13e-4e04-a571-d9790b3d3f2d:
    jobs:
      ut:
        select: always
        name: UT
        needs: []
        steps:
        - name: Download the source commit
          uses: official_git_clone
          identifier: 0
        - name: Checkout the PR source commit
          uses: official_shell_plugin
          env:
            CODEARTS_COMMIT_ID: "${COMMIT_ID}"
            CODEARTS_MERGE_ID: "${MERGE_ID}"
            CODEARTS_WEBHOOK_PAYLOAD: "${WEBHOOK_PAYLOAD}"
          with:
            OFFICIAL_SHELL_SCRIPT_INPUT: |
              set -eu
              if [ -z "${CODEARTS_MERGE_ID:-}" ]; then
                echo "MERGE_ID is empty; keeping the downloaded source commit"
                exit 0
              fi

              cd "${SHARE_PATH:?CodeArts did not set SHARE_PATH}"
              # GitCode's PR or PR-note payload carries the source head for this run.
              SOURCE_METADATA=$(node <<'NODE'
              const payloadText = process.env.CODEARTS_WEBHOOK_PAYLOAD;
              if (!payloadText) throw new Error("CODEARTS_WEBHOOK_PAYLOAD is empty");
              const payload = JSON.parse(payloadText);
              const mergeId = process.env.CODEARTS_MERGE_ID;
              let attributes;
              if (payload.event_type === "merge_request") {
                attributes = payload.object_attributes;
              } else if (
                payload.event_type === "note" &&
                payload.object_attributes?.noteable_type === "MergeRequest"
              ) {
                attributes = payload.merge_request;
              } else {
                throw new Error(`expected a merge_request or PR note payload, received ${String(payload.event_type)}`);
              }
              const sourceBranch = attributes?.source_branch;
              const sourceSha = process.env.CODEARTS_COMMIT_ID;
              const payloadMergeId = attributes?.iid;
              if (!attributes) {
                throw new Error("the webhook payload has no merge_request metadata");
              }
              const hasLineBreak = typeof sourceBranch === "string" && (
                sourceBranch.includes(String.fromCharCode(10)) || sourceBranch.includes(String.fromCharCode(13))
              );
              if (typeof sourceBranch !== "string" || sourceBranch.length === 0 || hasLineBreak) {
                throw new Error("the MR payload has no valid source branch");
              }
              if (typeof sourceSha !== "string" || !/^[0-9a-f]{40}$/i.test(sourceSha)) {
                throw new Error("the MR payload has no valid source commit SHA");
              }
              if (typeof mergeId !== "string" || !/^[1-9][0-9]*$/.test(mergeId)) {
                throw new Error("CodeArts did not provide a valid merge request number");
              }
              if (payloadMergeId !== undefined && String(payloadMergeId) !== mergeId) {
                throw new Error(`payload merge request ${String(payloadMergeId)} does not match ${mergeId}`);
              }
              console.log(sourceBranch);
              console.log(sourceSha.toLowerCase());
              console.log(mergeId);
              NODE
              )
              SOURCE_BRANCH=$(printf '%s\n' "$SOURCE_METADATA" | sed -n '1p')
              SOURCE_SHA=$(printf '%s\n' "$SOURCE_METADATA" | sed -n '2p')
              MR_NUMBER=$(printf '%s\n' "$SOURCE_METADATA" | sed -n '3p')
              git check-ref-format --branch "$SOURCE_BRANCH" >/dev/null

              # The upstream merge-request ref exists for both same-repository and
              # fork PRs. Detach at the event SHA so a later update cannot change
              # the code covered by this pipeline run.
              FETCH_REF=refs/remotes/origin/codearts-pr-source
              git fetch --no-tags --force origin "+refs/merge-requests/$MR_NUMBER/head:$FETCH_REF"
              if ! git cat-file -e "$SOURCE_SHA^{commit}" 2>/dev/null; then
                git fetch --no-tags origin "$SOURCE_SHA"
              fi
              if ! git merge-base --is-ancestor "$SOURCE_SHA" "$FETCH_REF"; then
                echo "FATAL: trigger commit $SOURCE_SHA is not reachable from source branch $SOURCE_BRANCH" >&2
                exit 1
              fi
              git checkout --detach "$SOURCE_SHA"
              ACTUAL_SHA=$(git rev-parse HEAD)
              if [ "$ACTUAL_SHA" != "$SOURCE_SHA" ]; then
                echo "FATAL: expected PR source $SOURCE_SHA, checked out $ACTUAL_SHA" >&2
                exit 1
              fi
              echo "checked out PR source: branch=$SOURCE_BRANCH sha=$ACTUAL_SHA"
              git show -s --format='subject: %s'
          identifier: 6
        - name: Provision the runner
          uses: official_shell_plugin
          with:
            OFFICIAL_SHELL_SCRIPT_INPUT: |
              set -eu
              SOURCE_DIR="${SHARE_PATH:?CodeArts did not set SHARE_PATH}"
              echo "source directory: $SOURCE_DIR"
              if [ ! -f "$SOURCE_DIR/pnpm-workspace.yaml" ]; then
                echo "FATAL: the download task did not create the expected source directory"
                ls -la "$SHARE_PATH" || true
                exit 1
              fi
              cd "$SOURCE_DIR"
              export CI_NPM_REGISTRY="${{ env.HUAWEICLOUD_NPM_REGISTRY }}"
              export CI_PYPI_INDEX="${{ env.HUAWEICLOUD_PYPI_INDEX }}"
              export CI_BINARY_CACHE_URL="${{ env.CI_BINARY_CACHE_URL }}"
              export CI_BINARY_CACHE_DIR="$PWD/.ci-results/toolchain-cache"
              bash .ci/provision-runner.sh
          identifier: 1
        - name: Retarget Python lockfiles to Huawei mirror
          uses: official_shell_plugin
          with:
            OFFICIAL_SHELL_SCRIPT_INPUT: |
              set -eu
              cd "${SHARE_PATH:?CodeArts did not set SHARE_PATH}"
              export PATH="$HOME/.local/node/bin:$HOME/.local/share/pnpm:$HOME/.local/bin:$PATH"
              export UV_DEFAULT_INDEX="${{ env.HUAWEICLOUD_PYPI_INDEX }}"
              export UV_PYTHON_INSTALL_MIRROR="${{ env.NPMMIRROR_PYTHON_INSTALL_MIRROR }}"
              echo "python install mirror: $UV_PYTHON_INSTALL_MIRROR"
              for PYTHON_PROJECT in services/gateway services/paper services/memory-graph; do
                LOCK_FILE="$PYTHON_PROJECT/uv.lock"
                echo "retargeting $LOCK_FILE to $UV_DEFAULT_INDEX"
                LOCKED_VERSIONS=$(sed -n -e '/^name = /p' -e '/^version = /p' "$LOCK_FILE")
                uv lock --project "$PYTHON_PROJECT"
                RETARGETED_VERSIONS=$(sed -n -e '/^name = /p' -e '/^version = /p' "$LOCK_FILE")
                if [ "$LOCKED_VERSIONS" != "$RETARGETED_VERSIONS" ]; then
                  echo "FATAL: retargeting $LOCK_FILE changed locked package versions" >&2
                  exit 1
                fi
              done
          identifier: 2
        - name: Run and stage UT log
          uses: official_shell_plugin
          with:
            OFFICIAL_SHELL_SCRIPT_INPUT: |
              set -eu
              cd "${SHARE_PATH:?CodeArts did not set SHARE_PATH}"
              export PATH="$HOME/.local/node/bin:$HOME/.local/share/pnpm:$HOME/.local/bin:$PATH"
              export CI_RESULTS_DIR="$PWD/.ci-results"
              export CI_RUNTIME_DIR="$HOME/ci-runtime-ut"
              export UV_DEFAULT_INDEX="${{ env.HUAWEICLOUD_PYPI_INDEX }}"
              export UV_PYTHON_INSTALL_MIRROR="${{ env.NPMMIRROR_PYTHON_INSTALL_MIRROR }}"
              echo "dependency mirrors: npm=$(npm config get registry), pypi=$UV_DEFAULT_INDEX, python=$UV_PYTHON_INSTALL_MIRROR"
              RESULT_DIR=.ci-results/ut-core
              RESULT_LOG="$RESULT_DIR/run.log"
              mkdir -p "$RESULT_DIR"
              set +e
              pnpm ci:ut:core
              TEST_RC=$?
              set -e
              printf '%s\n' "$TEST_RC" > "$RESULT_DIR/exit-code"
              if [ ! -f "$RESULT_LOG" ]; then
                printf 'pnpm ci:ut:core exited with status %s before run.log was created.\n' "$TEST_RC" > "$RESULT_LOG"
              fi
              echo "=== UT run.log (last 80 lines) ==="
              tail -n 80 "$RESULT_LOG"
          identifier: 3
        - name: Upload UT log to OBS
          uses: upload-obs
          with:
            endpoint_select: f4cb5fdf6d5d498eaa28721bc30beb0c
            endpoint: obs.cn-north-4.myhuaweicloud.com
            bucket: openjiuwen-ci
            key: "sciencediscovery/ci/${{ sources.sciencediscovery.commit_id }}/${{ pipeline.run_id }}/ut/run.log"
            source_file: "${SHARE_PATH}/.ci-results/ut-core/run.log"
            self_folder: "false"
          identifier: 4
        - name: Report UT result
          uses: official_shell_plugin
          with:
            OFFICIAL_SHELL_SCRIPT_INPUT: |
              set -eu
              cd "${SHARE_PATH:?CodeArts did not set SHARE_PATH}"
              TEST_RC=$(cat .ci-results/ut-core/exit-code)
              echo "UT exited with status $TEST_RC"
              exit "$TEST_RC"
          identifier: 5
        if: "${{ default() }}"
        runs-on:
        - codearts-hosted
        - ubuntu-latest
        - x64
        - large
