# Smoke test for the GitCode side of CI, the counterpart of
# .github/workflows/ci.yml. It does not run UT/ST/E2E yet. It answers the three
# questions that have to be settled before those layers can be ported here:
# does the merge-request trigger actually fire, what does the pipeline context
# carry, and what does the runner already have installed. The artifact file is
# written and then read back, so both the workspace and the log are verified.
#
# Editing this pipeline in the CodeArts web editor may rewrite the file and
# drop these comments; keep this file the source of truth.

concurrency:
  max: 5
  enable: false
  preemption:
    enable: false
    events:
    - mr_id
  exceed-action: IGNORE
sources:
  sciencediscovery:
    type: gitcode
    name: sciencediscovery
    branch: main
    git_url: https://gitcode.com/openJiuwen/sciencediscovery.git
    ssh_git_url: git@gitcode.com:openJiuwen/sciencediscovery.git
    endpoint_id: c4451a2a11af48baacd6b2af5eee3075
    repo_id: 10597680
# The four merge-request types are the GitCode equivalent of the GitHub
# workflow's opened/synchronize/reopened: `open` and `reopen` cover creating and
# reopening a merge request, `update` covers every later push to it, and `merge`
# fires once when it lands on main. code-update stays false so a settings-only
# change is checked too, matching how GitHub re-runs on every synchronize.
on:
  sources: 
    sciencediscovery:
      merge_requests:
        branches:
        - main
        paths: []
        types:
        - open
        - update
        - merge
        - reopen
        branches-ignore: []
        paths-ignore: []
        code-update: false
stages:
  # The stage identifier was generated when the pipeline was converted to a
  # repository-hosted definition. It is kept verbatim so the file still matches
  # the pipeline record on the server.
  1787408436254dc0bce78-f2e3-4077-9747-9882b5a1fb12:
    jobs:
      smoke_test:
        select: selected_by_default
        name: Smoke test
        needs: []
        steps:
        - name: Report the trigger and the runner
          run: |
            echo "=== trigger ==="
            echo "pipeline run  : #${{ pipeline.run_number }} (${{ pipeline.trigger_type }})"
            echo "repository    : ${{ sources.sciencediscovery.repo_name }}"
            echo "merge request : ${{ sources.sciencediscovery.merge_id }}"
            echo "source branch : ${{ sources.sciencediscovery.source_branch }}"
            echo "target branch : ${{ sources.sciencediscovery.target_branch }}"
            echo "commit        : ${{ sources.sciencediscovery.commit_id_short }}"
            echo
            echo "=== runner ==="
            echo "working dir   : $(pwd)"
            echo "kernel        : $(uname -srm)"
            # Whether the source is already checked out decides if the ported
            # layers need an explicit clone step in front of them.
            echo "checkout here : $(test -f package.json && echo yes || echo no)"
            for tool in git node pnpm uv docker bwrap; do
              printf '%-14s: %s\n' "$tool" "$(command -v "$tool" || echo 'not installed')"
            done
        - name: Write the artifact file
          run: |
            mkdir -p ci-artifacts
            {
              echo "ScienceDiscovery CodeArts smoke test"
              echo "run number    : ${{ pipeline.run_number }}"
              echo "trigger       : ${{ pipeline.trigger_type }}"
              echo "merge request : ${{ sources.sciencediscovery.merge_id }}"
              echo "commit        : ${{ sources.sciencediscovery.commit_id_short }}"
              echo "generated at  : $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            } > ci-artifacts/smoke.txt
        - name: Verify the artifact file
          run: |
            ls -l ci-artifacts
            echo "--- ci-artifacts/smoke.txt ---"
            cat ci-artifacts/smoke.txt
            # Fails the job if the previous step produced an empty file.
            test -s ci-artifacts/smoke.txt
        if: "${{ default() }}"
        runs-on:
        - default
    pre:
    - type: auto
    name: Smoke
    select: selected_by_default
    fail-fast: false
