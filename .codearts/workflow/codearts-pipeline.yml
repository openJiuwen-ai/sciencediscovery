concurrency:
  max: 5
  enable: false
  exceed-action: IGNORE
sources:
  sciencediscovery:
    type: gitcode
    name: sciencediscovery
    branch: ci/verify-pr-ci
    git_url: https://gitcode.com/openJiuwen/sciencediscovery.git
    ssh_git_url: git@gitcode.com:openJiuwen/sciencediscovery.git
    endpoint_id: c4451a2a11af48baacd6b2af5eee3075
    repo_id: 10597680
on:
  sources:
    sciencediscovery:
      merge_requests:
        branches:
        - main
        paths: []
        types:
        - open
        - update
        - merge
        - reopen
        branches-ignore: []
        paths-ignore: []
        code-update: false
inputs:
  # The child run has no MERGE_ID of its own. Bridge the parent's MR ID through
  # an explicit child input; a manual run may supply one or leave it empty to
  # run only UT/ST.
  PR_ID:
    type: string
    default: "${MERGE_ID}"
    manual_override: true
  HUAWEICLOUD_NPM_REGISTRY:
    type: string
    default: https://repo.huaweicloud.com/repository/npm/
    manual_override: false
  HUAWEICLOUD_PYPI_INDEX:
    type: string
    default: https://repo.huaweicloud.com/repository/pypi/simple
    manual_override: false
  NPMMIRROR_PYTHON_INSTALL_MIRROR:
    type: string
    default: https://registry.npmmirror.com/-/binary/python-build-standalone
    manual_override: false
stages:
  176464703972462e4780d-56ca-4c54-9c49-29291c471dfd:
    jobs:
      create_label:
        select: selected_by_default
        name: Mark PR checks as running
        needs: []
        steps:
        - name: Create the running label
          uses: official_devcloud_cloudBuild
          with:
            number: "${MERGE_ID}"
            WEBHOOK_PAYLOAD: "${WEBHOOK_PAYLOAD}"
            __sameProject__: "true"
            __projectId__: ""
            jobId: dc2f05de339b410a972184a84b9f1c6f
            __repository__: sciencediscovery
            artifactIdentifier: ""
          identifier: 17736446667235cd01d5c-c29e-41f5-ab85-52bba5fce5ed
        if: "${{ pipeline.trigger_type == 'MR' }}"
        runs-on:
        - default
    pre:
    - type: auto
    name: Prepare PR
    select: selected_by_default
    fail-fast: false
  1787542687692903221df-b13e-4e04-a571-d9790b3d3f2d:
    jobs:
      ut:
        select: always
        name: UT
        needs: []
        steps:
        - name: Download the source commit
          uses: official_git_clone
          identifier: 0
        - name: Provision the runner
          uses: official_shell_plugin
          with:
            OFFICIAL_SHELL_SCRIPT_INPUT: |
              set -eu
              SOURCE_DIR="${SHARE_PATH:?CodeArts did not set SHARE_PATH}"
              echo "source directory: $SOURCE_DIR"
              if [ ! -f "$SOURCE_DIR/pnpm-workspace.yaml" ]; then
                echo "FATAL: the download task did not create the expected source directory"
                ls -la "$SHARE_PATH" || true
                exit 1
              fi
              cd "$SOURCE_DIR"
              export CI_NPM_REGISTRY="${{ env.HUAWEICLOUD_NPM_REGISTRY }}"
              export CI_PYPI_INDEX="${{ env.HUAWEICLOUD_PYPI_INDEX }}"
              bash .ci/provision-runner.sh
          identifier: 1
        - name: Retarget Python lockfiles to Huawei mirror
          uses: official_shell_plugin
          with:
            OFFICIAL_SHELL_SCRIPT_INPUT: |
              set -eu
              cd "${SHARE_PATH:?CodeArts did not set SHARE_PATH}"
              export PATH="$HOME/.local/node/bin:$HOME/.local/share/pnpm:$HOME/.local/bin:$PATH"
              export UV_DEFAULT_INDEX="${{ env.HUAWEICLOUD_PYPI_INDEX }}"
              export UV_PYTHON_INSTALL_MIRROR="${{ env.NPMMIRROR_PYTHON_INSTALL_MIRROR }}"
              echo "python install mirror: $UV_PYTHON_INSTALL_MIRROR"
              for PYTHON_PROJECT in services/gateway services/paper services/memory-graph; do
                LOCK_FILE="$PYTHON_PROJECT/uv.lock"
                echo "retargeting $LOCK_FILE to $UV_DEFAULT_INDEX"
                LOCKED_VERSIONS=$(sed -n -e '/^name = /p' -e '/^version = /p' "$LOCK_FILE")
                uv lock --project "$PYTHON_PROJECT"
                RETARGETED_VERSIONS=$(sed -n -e '/^name = /p' -e '/^version = /p' "$LOCK_FILE")
                if [ "$LOCKED_VERSIONS" != "$RETARGETED_VERSIONS" ]; then
                  echo "FATAL: retargeting $LOCK_FILE changed locked package versions" >&2
                  exit 1
                fi
              done
          identifier: 2
        - name: Run and stage UT log
          uses: official_shell_plugin
          with:
            OFFICIAL_SHELL_SCRIPT_INPUT: |
              set -eu
              cd "${SHARE_PATH:?CodeArts did not set SHARE_PATH}"
              export PATH="$HOME/.local/node/bin:$HOME/.local/share/pnpm:$HOME/.local/bin:$PATH"
              export CI_RESULTS_DIR="$PWD/.ci-results"
              export CI_RUNTIME_DIR="$HOME/ci-runtime-ut"
              export UV_DEFAULT_INDEX="${{ env.HUAWEICLOUD_PYPI_INDEX }}"
              export UV_PYTHON_INSTALL_MIRROR="${{ env.NPMMIRROR_PYTHON_INSTALL_MIRROR }}"
              echo "dependency mirrors: npm=$(npm config get registry), pypi=$UV_DEFAULT_INDEX, python=$UV_PYTHON_INSTALL_MIRROR"
              RESULT_DIR=.ci-results/ut-core
              RESULT_LOG="$RESULT_DIR/run.log"
              mkdir -p "$RESULT_DIR"
              set +e
              pnpm ci:ut:core
              TEST_RC=$?
              set -e
              printf '%s\n' "$TEST_RC" > "$RESULT_DIR/exit-code"
              if [ ! -f "$RESULT_LOG" ]; then
                printf 'pnpm ci:ut:core exited with status %s before run.log was created.\n' "$TEST_RC" > "$RESULT_LOG"
              fi
              echo "=== UT run.log (last 80 lines) ==="
              tail -n 80 "$RESULT_LOG"
          identifier: 3
        - name: Upload UT log to OBS
          uses: upload-obs
          with:
            endpoint_select: f4cb5fdf6d5d498eaa28721bc30beb0c
            endpoint: obs.cn-north-4.myhuaweicloud.com
            bucket: openjiuwen-ci
            key: "sciencediscovery/ci/${{ sources.sciencediscovery.commit_id }}/${{ pipeline.run_id }}/ut/run.log"
            source_file: "${SHARE_PATH}/.ci-results/ut-core/run.log"
            self_folder: "false"
          identifier: 4
        - name: Report UT result
          uses: official_shell_plugin
          with:
            OFFICIAL_SHELL_SCRIPT_INPUT: |
              set -eu
              cd "${SHARE_PATH:?CodeArts did not set SHARE_PATH}"
              TEST_RC=$(cat .ci-results/ut-core/exit-code)
              echo "UT exited with status $TEST_RC"
              exit "$TEST_RC"
          identifier: 5
        if: "${{ default() }}"
        runs-on:
        - codearts-hosted
        - ubuntu-latest
        - x64
        - large
      st:
        select: always
        name: ST
        needs: []
        steps:
        - name: Download the source commit
          uses: official_git_clone
          identifier: 0
        - name: Provision the runner
          uses: official_shell_plugin
          with:
            OFFICIAL_SHELL_SCRIPT_INPUT: |
              set -eu
              SOURCE_DIR="${SHARE_PATH:?CodeArts did not set SHARE_PATH}"
              echo "source directory: $SOURCE_DIR"
              if [ ! -f "$SOURCE_DIR/pnpm-workspace.yaml" ]; then
                echo "FATAL: the download task did not create the expected source directory"
                ls -la "$SHARE_PATH" || true
                exit 1
              fi
              cd "$SOURCE_DIR"
              export CI_NPM_REGISTRY="${{ env.HUAWEICLOUD_NPM_REGISTRY }}"
              export CI_PYPI_INDEX="${{ env.HUAWEICLOUD_PYPI_INDEX }}"
              bash .ci/provision-runner.sh
          identifier: 1
        - name: Run and stage ST log
          uses: official_shell_plugin
          with:
            OFFICIAL_SHELL_SCRIPT_INPUT: |
              set -eu
              cd "${SHARE_PATH:?CodeArts did not set SHARE_PATH}"
              export PATH="$HOME/.local/node/bin:$HOME/.local/share/pnpm:$HOME/.local/bin:$PATH"
              export CI_RESULTS_DIR="$PWD/.ci-results"
              export CI_RUNTIME_DIR="$HOME/ci-runtime-st"
              export UV_DEFAULT_INDEX="${{ env.HUAWEICLOUD_PYPI_INDEX }}"
              export UV_PYTHON_INSTALL_MIRROR="${{ env.NPMMIRROR_PYTHON_INSTALL_MIRROR }}"
              echo "dependency mirrors: npm=$(npm config get registry), pypi=$UV_DEFAULT_INDEX, python=$UV_PYTHON_INSTALL_MIRROR"
              RESULT_DIR=.ci-results/st
              RESULT_LOG="$RESULT_DIR/run.log"
              mkdir -p "$RESULT_DIR"
              set +e
              pnpm ci:st
              TEST_RC=$?
              set -e
              printf '%s\n' "$TEST_RC" > "$RESULT_DIR/exit-code"
              if [ ! -f "$RESULT_LOG" ]; then
                printf 'pnpm ci:st exited with status %s before run.log was created.\n' "$TEST_RC" > "$RESULT_LOG"
              fi
              echo "=== ST run.log (last 80 lines) ==="
              tail -n 80 "$RESULT_LOG"
          identifier: 2
        - name: Upload ST log to OBS
          uses: upload-obs
          with:
            endpoint_select: f4cb5fdf6d5d498eaa28721bc30beb0c
            endpoint: obs.cn-north-4.myhuaweicloud.com
            bucket: openjiuwen-ci
            key: "sciencediscovery/ci/${{ sources.sciencediscovery.commit_id }}/${{ pipeline.run_id }}/st/run.log"
            source_file: "${SHARE_PATH}/.ci-results/st/run.log"
            self_folder: "false"
          identifier: 3
        - name: Report ST result
          uses: official_shell_plugin
          with:
            OFFICIAL_SHELL_SCRIPT_INPUT: |
              set -eu
              cd "${SHARE_PATH:?CodeArts did not set SHARE_PATH}"
              TEST_RC=$(cat .ci-results/st/exit-code)
              echo "ST exited with status $TEST_RC"
              exit "$TEST_RC"
          identifier: 4
        if: "${{ default() }}"
        runs-on:
        - codearts-hosted
        - ubuntu-latest
        - x64
        - large
      code_check:
        select: always
        name: 子流水线
        needs: []
        steps:
        - name: 子流水线
          uses: official_devcloud_subPipeline
          with:
            PR_ID: "${PR_ID}"
            repo_url: "${REPO_URL}"
            branch: "${test-agentcore_REPOSITORY_BRANCH}"
            repo_name: "${test-agentcore_REPOSITORY_NAME}"
            pipeline_name: "${PIPELINE_NAME}"
            number: "${PR_ID}"
            webhook_payload: "${WEBHOOK_PAYLOAD}"
            __sameProject__: "true"
            __projectId__: ""
            SYSTEM_DEVCLOUD_SUBPIPELINE_TRIGGER_ID: 3a80cbaf5dec4e0b8804ce1401787f5f
            SYSTEM_DEVCLOUD_SUBPIPELINE_BRANCH: PARENT
            SYSTEM_DEVCLOUD_SUBPIPELINE_EXECUTE_BRANCH: ""
            _OFFICIAL_DEVCLOUD_JOB_NAME_: sciencediscovery-jiuwen-check
            _OFFICIAL_DEVCLOUD_JOB_VERSION_: 4.0
          identifier: 1787572530852dd5a9499-1b45-4378-bf48-082dc7948978
        if: "${{ pipeline.trigger_type == 'MR' || inputs.PR_ID != '' }}"
        runs-on:
        - default
    pre:
    - type: auto
    name: CI
    select: always
    fail-fast: false
post:
  jobs:
    publish_pr_success:
      select: always
      name: Publish successful PR result
      needs: []
      steps:
      - name: Comment and mark the PR successful
        uses: official_devcloud_cloudBuild
        with:
          number: "${MERGE_ID}"
          result_html: |
            <p>&#9989; CodeArts 流水线 <a href="${PASS_CONDITIONS_LINK}">${{ pipeline.run_id }}</a> 执行成功。</p>
            <table style="border-collapse: collapse">
              <tr><th>任务名称</th><th>CodeArts 状态</th><th>日志</th></tr>
              <tr><td>代码检查</td><td>${{ jobs.code_check.status }}</td><td><a href="${PASS_CONDITIONS_LINK}">点此跳转</a></td></tr>
              <tr><td>UT</td><td>${{ jobs.ut.status }}</td><td><a href="${PASS_CONDITIONS_LINK}">点此跳转</a></td></tr>
              <tr><td>ST</td><td>${{ jobs.st.status }}</td><td><a href="${PASS_CONDITIONS_LINK}">点此跳转</a></td></tr>
            </table>
          final_label: ci-successful
          WEBHOOK_PAYLOAD: "${WEBHOOK_PAYLOAD}"
          __sameProject__: "true"
          __projectId__: ""
          jobId: 215834b7550740b89a70d4fd9f55b4d2
          __repository__: sciencediscovery
          artifactIdentifier: ""
        identifier: 17646737830615fa277f2-7774-46a9-9222-bdd6236e9912
      if: "${{ pipeline.trigger_type == 'MR' && completed('ut', 'st', 'code_check') }}"
      runs-on:
      - default
    publish_pr_failure:
      select: always
      name: Publish failed PR result
      needs: []
      steps:
      - name: Comment and mark the PR failed
        uses: official_devcloud_cloudBuild
        with:
          number: "${MERGE_ID}"
          result_html: |
            <p>&#10060; CodeArts 流水线 <a href="${PASS_CONDITIONS_LINK}">${{ pipeline.run_id }}</a> 执行失败。</p>
            <table style="border-collapse: collapse">
              <tr><th>任务名称</th><th>CodeArts 状态</th><th>日志</th></tr>
              <tr><td>代码检查</td><td>${{ jobs.code_check.status }}</td><td><a href="${PASS_CONDITIONS_LINK}">点此跳转</a></td></tr>
              <tr><td>UT</td><td>${{ jobs.ut.status }}</td><td><a href="${PASS_CONDITIONS_LINK}">点此跳转</a></td></tr>
              <tr><td>ST</td><td>${{ jobs.st.status }}</td><td><a href="${PASS_CONDITIONS_LINK}">点此跳转</a></td></tr>
            </table>
          final_label: ci-failed
          WEBHOOK_PAYLOAD: "${WEBHOOK_PAYLOAD}"
          __sameProject__: "true"
          __projectId__: ""
          jobId: 215834b7550740b89a70d4fd9f55b4d2
          __repository__: sciencediscovery
          artifactIdentifier: ""
        identifier: 1790000000000b7abf11-329f-448a-bdc4-f1db550865d3
      if: "${{ pipeline.trigger_type == 'MR' && !completed('ut', 'st', 'code_check') }}"
      runs-on:
      - default
  pre:
  - type: auto
  select: always
  fail-fast: false
