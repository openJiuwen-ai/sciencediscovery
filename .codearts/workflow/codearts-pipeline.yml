post:
  jobs:
    prepare_pr_success:
      select: always
      name: Prepare successful PR result
      needs: []
      steps:
      - name: Render successful PR result
        uses: official_shell_plugin
        with:
          OFFICIAL_SHELL_SCRIPT_INPUT: |
            set -eu
            RESULT_DIR="${SHARE_PATH:?CodeArts did not set SHARE_PATH}/.ci-results/pr-result"
            RESULT_FILE="$RESULT_DIR/result.html"
            mkdir -p "$RESULT_DIR"
            PR_CHECK_URL="https://gitcode.com/openJiuwen/sciencediscovery/pull/${MERGE_ID}/check"
            CODECHECK_RESULT_BASE="https://openjiuwen-ci.obs.cn-north-4.myhuaweicloud.com/sciencediscovery"
            UT_LOG_URL="https://openjiuwen-ci.obs.cn-north-4.myhuaweicloud.com/sciencediscovery/ci/${{ sources.sciencediscovery.commit_id }}/${{ pipeline.run_id }}/ut/run.log"
            ST_LOG_URL="https://openjiuwen-ci.obs.cn-north-4.myhuaweicloud.com/sciencediscovery/ci/${{ sources.sciencediscovery.commit_id }}/${{ pipeline.run_id }}/st/run.log"
            result_link_cell() {
              python3 - "$1" <<'PY'
            import html
            import json
            import sys
            from urllib.parse import urlsplit
            from urllib.request import Request, urlopen

            result_url = sys.argv[1]
            try:
                request = Request(result_url, headers={"User-Agent": "ScienceDiscovery-CodeArts"})
                with urlopen(request, timeout=30) as response:
                    link = json.load(response).get("link")
                parsed = urlsplit(link) if isinstance(link, str) else None
                if not parsed or parsed.scheme != "https" or not parsed.netloc:
                    raise ValueError("result link must be an absolute HTTPS URL")
                print('<a href="{}">点此跳转</a>'.format(html.escape(link, quote=True)))
            except Exception as error:
                print("could not load code-check link from {}: {}".format(result_url, error), file=sys.stderr)
                print("N/A")
            PY
            }
            public_log_cell() {
              python3 - "$1" "$PR_CHECK_URL" <<'PY'
            import html
            import sys
            from urllib.request import Request, urlopen

            log_url, checks_url = sys.argv[1:3]
            try:
                request = Request(
                    log_url,
                    headers={"Range": "bytes=0-0", "User-Agent": "ScienceDiscovery-CodeArts"},
                )
                with urlopen(request, timeout=10) as response:
                    if response.status not in (200, 206):
                        raise ValueError("unexpected HTTP status {}".format(response.status))
                print('<a href="{}">公开日志</a>'.format(html.escape(log_url, quote=True)))
            except Exception as error:
                print("public test log is unavailable at {}: {}".format(log_url, error), file=sys.stderr)
                print(
                    '<a href="{}">查看构建日志</a>（公开测试日志未生成）'.format(
                        html.escape(checks_url, quote=True)
                    )
                )
            PY
            }
            CODECHECK_LINK_CELL=$(result_link_cell "$CODECHECK_RESULT_BASE/codecheck/${MERGE_ID}/codecheck.json")
            BLACKLIST_LINK_CELL=$(result_link_cell "$CODECHECK_RESULT_BASE/blacklist/${MERGE_ID}/blacklist.json")
            ANTI_POISON_LINK_CELL=$(result_link_cell "$CODECHECK_RESULT_BASE/anti_poison/${MERGE_ID}/anti_poison.json")
            SCA_LINK_CELL=$(result_link_cell "$CODECHECK_RESULT_BASE/sca/${MERGE_ID}/sca.json")
            UT_LOG_CELL=$(public_log_cell "$UT_LOG_URL")
            ST_LOG_CELL=$(public_log_cell "$ST_LOG_URL")
            cat > "$RESULT_FILE" <<RESULT_HTML
            <p>&#9989; 流水线 <a href="$PR_CHECK_URL">${{ pipeline.run_id }}</a> 执行成功。</p>
            <p>可在 <a href="$PR_CHECK_URL">$PR_CHECK_URL</a> 查看完整构建日志。</p>
            <table style="border-collapse: collapse">
              <tr><th>任务名称</th><th>子任务</th><th>状态</th><th>详情</th></tr>
              <tr><td rowspan="4">代码检查</td><td>SCA（开源合规）</td><td rowspan="4">PASSED（子流水线汇总）</td><td>$SCA_LINK_CELL</td></tr>
              <tr><td>Anti-poison（防投毒）</td><td>$ANTI_POISON_LINK_CELL</td></tr>
              <tr><td>CodeCheck（静态检查）</td><td>$CODECHECK_LINK_CELL</td></tr>
              <tr><td>Blacklist（禁用词）</td><td>$BLACKLIST_LINK_CELL</td></tr>
              <tr><td>UT</td><td>-</td><td>PASSED</td><td>$UT_LOG_CELL</td></tr>
              <tr><td>ST</td><td>-</td><td>PASSED</td><td>$ST_LOG_CELL</td></tr>
            </table>
            RESULT_HTML
            test -s "$RESULT_FILE"
            echo "rendered PR result: $RESULT_FILE"
        identifier: 1790000000001f3bdf0d-9082-493c-b505-da94b01fd1ef
      - name: Upload successful PR result to OBS
        uses: upload-obs
        with:
          endpoint_select: f4cb5fdf6d5d498eaa28721bc30beb0c
          endpoint: obs.cn-north-4.myhuaweicloud.com
          bucket: openjiuwen-ci
          key: "sciencediscovery/ci/${{ sources.sciencediscovery.commit_id }}/${{ pipeline.run_id }}/pr/result.html"
          source_file: "${SHARE_PATH}/.ci-results/pr-result/result.html"
          self_folder: "false"
        identifier: 1790000000002ca71171-679f-4414-948c-ff6497de4ab7
      if: "${{ pipeline.trigger_type == 'MR' && completed('ut', 'st', 'code_check') }}"
      runs-on:
      - default
    publish_pr_success:
      select: always
      name: Publish successful PR result
      needs:
      - prepare_pr_success
      steps:
      - name: Comment and mark the PR successful
        uses: official_devcloud_cloudBuild
        with:
          number: "${MERGE_ID}"
          result_html: "sciencediscovery/ci/${{ sources.sciencediscovery.commit_id }}/${{ pipeline.run_id }}/pr/result.html"
          final_label: ci-successful
          __sameProject__: "true"
          __projectId__: ""
          jobId: 52d1699f53ca463ab77c4c4398be7e5a
          __repository__: sciencediscovery
          artifactIdentifier: ""
        identifier: 17646737830615fa277f2-7774-46a9-9222-bdd6236e9912
      if: "${{ pipeline.trigger_type == 'MR' && completed('ut', 'st', 'code_check') }}"
      runs-on:
      - default
    prepare_pr_failure:
      select: always
      name: Prepare failed PR result
      needs: []
      steps:
      - name: Render failed PR result
        uses: official_shell_plugin
        with:
          OFFICIAL_SHELL_SCRIPT_INPUT: |
            set -eu
            RESULT_DIR="${SHARE_PATH:?CodeArts did not set SHARE_PATH}/.ci-results/pr-result"
            RESULT_FILE="$RESULT_DIR/result.html"
            mkdir -p "$RESULT_DIR"
            PR_CHECK_URL="https://gitcode.com/openJiuwen/sciencediscovery/pull/${MERGE_ID}/check"
            CODECHECK_RESULT_BASE="https://openjiuwen-ci.obs.cn-north-4.myhuaweicloud.com/sciencediscovery"
            UT_LOG_URL="https://openjiuwen-ci.obs.cn-north-4.myhuaweicloud.com/sciencediscovery/ci/${{ sources.sciencediscovery.commit_id }}/${{ pipeline.run_id }}/ut/run.log"
            ST_LOG_URL="https://openjiuwen-ci.obs.cn-north-4.myhuaweicloud.com/sciencediscovery/ci/${{ sources.sciencediscovery.commit_id }}/${{ pipeline.run_id }}/st/run.log"
            result_link_cell() {
              python3 - "$1" <<'PY'
            import html
            import json
            import sys
            from urllib.parse import urlsplit
            from urllib.request import Request, urlopen

            result_url = sys.argv[1]
            try:
                request = Request(result_url, headers={"User-Agent": "ScienceDiscovery-CodeArts"})
                with urlopen(request, timeout=30) as response:
                    link = json.load(response).get("link")
                parsed = urlsplit(link) if isinstance(link, str) else None
                if not parsed or parsed.scheme != "https" or not parsed.netloc:
                    raise ValueError("result link must be an absolute HTTPS URL")
                print('<a href="{}">点此跳转</a>'.format(html.escape(link, quote=True)))
            except Exception as error:
                print("could not load code-check link from {}: {}".format(result_url, error), file=sys.stderr)
                print("N/A")
            PY
            }
            public_log_cell() {
              python3 - "$1" "$PR_CHECK_URL" <<'PY'
            import html
            import sys
            from urllib.request import Request, urlopen

            log_url, checks_url = sys.argv[1:3]
            try:
                request = Request(
                    log_url,
                    headers={"Range": "bytes=0-0", "User-Agent": "ScienceDiscovery-CodeArts"},
                )
                with urlopen(request, timeout=10) as response:
                    if response.status not in (200, 206):
                        raise ValueError("unexpected HTTP status {}".format(response.status))
                print('<a href="{}">公开日志</a>'.format(html.escape(log_url, quote=True)))
            except Exception as error:
                print("public test log is unavailable at {}: {}".format(log_url, error), file=sys.stderr)
                print(
                    '<a href="{}">查看构建日志</a>（公开测试日志未生成）'.format(
                        html.escape(checks_url, quote=True)
                    )
                )
            PY
            }
            job_result() {
              case "$(printf '%s' "$1" | tr '[:upper:]' '[:lower:]')" in
                completed|passed|success|successful|succeeded) printf 'PASSED' ;;
                *) printf 'FAILED' ;;
              esac
            }
            CODECHECK_LINK_CELL=$(result_link_cell "$CODECHECK_RESULT_BASE/codecheck/${MERGE_ID}/codecheck.json")
            BLACKLIST_LINK_CELL=$(result_link_cell "$CODECHECK_RESULT_BASE/blacklist/${MERGE_ID}/blacklist.json")
            ANTI_POISON_LINK_CELL=$(result_link_cell "$CODECHECK_RESULT_BASE/anti_poison/${MERGE_ID}/anti_poison.json")
            SCA_LINK_CELL=$(result_link_cell "$CODECHECK_RESULT_BASE/sca/${MERGE_ID}/sca.json")
            CODECHECK_RESULT=$(job_result "${{ jobs.code_check.status }}")
            UT_RESULT=$(job_result "${{ jobs.ut.status }}")
            ST_RESULT=$(job_result "${{ jobs.st.status }}")
            UT_LOG_CELL=$(public_log_cell "$UT_LOG_URL")
            ST_LOG_CELL=$(public_log_cell "$ST_LOG_URL")
            cat > "$RESULT_FILE" <<RESULT_HTML
            <p>&#10060; 流水线 <a href="$PR_CHECK_URL">${{ pipeline.run_id }}</a> 执行失败。</p>
            <p>可在 <a href="$PR_CHECK_URL">$PR_CHECK_URL</a> 查看完整构建日志。</p>
            <table style="border-collapse: collapse">
              <tr><th>任务名称</th><th>子任务</th><th>状态</th><th>详情</th></tr>
              <tr><td rowspan="4">代码检查</td><td>SCA（开源合规）</td><td rowspan="4">$CODECHECK_RESULT（子流水线汇总）</td><td>$SCA_LINK_CELL</td></tr>
              <tr><td>Anti-poison（防投毒）</td><td>$ANTI_POISON_LINK_CELL</td></tr>
              <tr><td>CodeCheck（静态检查）</td><td>$CODECHECK_LINK_CELL</td></tr>
              <tr><td>Blacklist（禁用词）</td><td>$BLACKLIST_LINK_CELL</td></tr>
              <tr><td>UT</td><td>-</td><td>$UT_RESULT</td><td>$UT_LOG_CELL</td></tr>
              <tr><td>ST</td><td>-</td><td>$ST_RESULT</td><td>$ST_LOG_CELL</td></tr>
            </table>
            RESULT_HTML
            test -s "$RESULT_FILE"
            echo "rendered PR result: $RESULT_FILE"
        identifier: 1790000000003e93ccb2-c3d7-4246-a79c-6e6079bb59cd
      - name: Upload failed PR result to OBS
        uses: upload-obs
        with:
          endpoint_select: f4cb5fdf6d5d498eaa28721bc30beb0c
          endpoint: obs.cn-north-4.myhuaweicloud.com
          bucket: openjiuwen-ci
          key: "sciencediscovery/ci/${{ sources.sciencediscovery.commit_id }}/${{ pipeline.run_id }}/pr/result.html"
          source_file: "${SHARE_PATH}/.ci-results/pr-result/result.html"
          self_folder: "false"
        identifier: 1790000000004756cae3-f5a6-4a02-a0e8-ab67c922ed75
      if: "${{ pipeline.trigger_type == 'MR' && !completed('ut', 'st', 'code_check') }}"
      runs-on:
      - default
    publish_pr_failure:
      select: always
      name: Publish failed PR result
      needs:
      - prepare_pr_failure
      steps:
      - name: Comment and mark the PR failed
        uses: official_devcloud_cloudBuild
        with:
          number: "${MERGE_ID}"
          result_html: "sciencediscovery/ci/${{ sources.sciencediscovery.commit_id }}/${{ pipeline.run_id }}/pr/result.html"
          final_label: ci-failed
          __sameProject__: "true"
          __projectId__: ""
          jobId: 52d1699f53ca463ab77c4c4398be7e5a
          __repository__: sciencediscovery
          artifactIdentifier: ""
        identifier: 1790000000000b7abf11-329f-448a-bdc4-f1db550865d3
      if: "${{ pipeline.trigger_type == 'MR' && !completed('ut', 'st', 'code_check') }}"
      runs-on:
      - default
  pre:
  - type: auto
  select: always
