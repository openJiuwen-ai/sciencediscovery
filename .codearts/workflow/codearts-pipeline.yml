post:
  jobs:
    prepare_pr_success:
      select: always
      name: Prepare successful PR result
      needs: []
      timeout: 10
      timeout_unit: minute
      steps:
      - name: Render the PR result on the x64 build task
        uses: official_devcloud_cloudBuild
        with:
          GIT_REPO_URL: https://gitcode.com/openJiuwen/sciencediscovery.git
          GIT_REF: "refs/merge-requests/${MERGE_ID}/head"
          GIT_TARGET_REF: "refs/heads/${sciencediscovery_TARGET_BRANCH}"
          SH_FILE_PATH: .ci/codearts-pr-result.sh
          ARTIFACT_PATH: .ci-results/publish
          OBS_BUCKET: openjiuwen-ci
          OBS_DIRECTORY: "sciencediscovery/ci/${{ sources.sciencediscovery.commit_id }}/${{ pipeline.run_id }}/pr/"
          OBS_ENDPOINT: obs.cn-north-4.myhuaweicloud.com
          ENVS: |-
            MERGE_ID=${MERGE_ID}
            CI_COMMIT=${{ sources.sciencediscovery.commit_id }}
            CI_RUN_ID=${{ pipeline.run_id }}
          ARGS: |-
            success
          __sameProject__: "true"
          __projectId__: ""
          jobId: f0b81e4b4b554747b84171782f7a2b15
          __repository__: sciencediscovery
          artifactIdentifier: ""
        identifier: 1788590000006a7b8c9d0-7777-4111-8007-6a7b8c9d0e07
      if: "${{ sources.sciencediscovery.merge_id != '' && completed('verify_results', 'code_check') }}"
      runs-on:
      - default
    publish_pr_success:
      select: always
      name: Publish successful PR result
      needs:
      - prepare_pr_success
      timeout: 5
      timeout_unit: minute
      steps:
      - name: Comment and mark the PR successful
        uses: official_devcloud_cloudBuild
        with:
          number: "${MERGE_ID}"
          result_html: "sciencediscovery/ci/${{ sources.sciencediscovery.commit_id }}/${{ pipeline.run_id }}/pr/result.html"
          final_label: ci-successful
          __sameProject__: "true"
          __projectId__: ""
          jobId: 52d1699f53ca463ab77c4c4398be7e5a
          __repository__: sciencediscovery
          artifactIdentifier: ""
        identifier: 17646737830615fa277f2-7774-46a9-9222-bdd6236e9912
      if: "${{ sources.sciencediscovery.merge_id != '' && completed('verify_results', 'code_check') }}"
      runs-on:
      - default
    prepare_pr_failure:
      select: always
      name: Prepare failed PR result
      needs: []
      timeout: 10
      timeout_unit: minute
      steps:
      - name: Render the PR result on the x64 build task
        uses: official_devcloud_cloudBuild
        with:
          GIT_REPO_URL: https://gitcode.com/openJiuwen/sciencediscovery.git
          GIT_REF: "refs/merge-requests/${MERGE_ID}/head"
          GIT_TARGET_REF: "refs/heads/${sciencediscovery_TARGET_BRANCH}"
          SH_FILE_PATH: .ci/codearts-pr-result.sh
          ARTIFACT_PATH: .ci-results/publish
          OBS_BUCKET: openjiuwen-ci
          OBS_DIRECTORY: "sciencediscovery/ci/${{ sources.sciencediscovery.commit_id }}/${{ pipeline.run_id }}/pr/"
          OBS_ENDPOINT: obs.cn-north-4.myhuaweicloud.com
          ENVS: |-
            MERGE_ID=${MERGE_ID}
            CI_COMMIT=${{ sources.sciencediscovery.commit_id }}
            CI_RUN_ID=${{ pipeline.run_id }}
          ARGS: |-
            failure
          __sameProject__: "true"
          __projectId__: ""
          jobId: f0b81e4b4b554747b84171782f7a2b15
          __repository__: sciencediscovery
          artifactIdentifier: ""
        identifier: 1788590000007b8c9d0e1-8888-4222-8008-7b8c9d0e1f08
      if: "${{ sources.sciencediscovery.merge_id != '' && !completed('verify_results', 'code_check') }}"
      runs-on:
      - default
    publish_pr_failure:
      select: always
      name: Publish failed PR result
      needs:
