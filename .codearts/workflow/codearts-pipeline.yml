# UT and ST on CodeArts Pipeline, using the same repository entry points as
# .gitcode/workflows/ci.yml. The default CodeArts pool cannot create the user
# namespaces bubblewrap needs, so UT deliberately runs ci:ut:core and E2E is
# left to GitHub. The hermetic ci:st layer needs neither a sandbox nor secrets.
#
# Every job downloads the source-context commit with CodeArts' built-in clone
# task before provisioning its own tools. The clone task handles repository
# credentials and places this source directly at ${SHARE_PATH}.
#
# Shell steps use `official_shell_plugin`, with the script under
# `with.OFFICIAL_SHELL_SCRIPT_INPUT`. CodeArts has no GitHub-style `run:` key:
# the server rewrites one into a nonexistent plugin named `official_shell` and
# rejects the pipeline before it starts.
#
# Editing this pipeline in the CodeArts web editor may rewrite the file and
# drop these comments; keep this file the source of truth.

# Keep these mirrors CodeArts-specific: the pool is in Huawei Cloud, while the
# GitHub jobs may run outside China. Shell steps reference the values explicitly
# because CodeArts `env` entries are pipeline parameters, not implicit exports.
# Committed uv lockfiles retain their original registries for other platforms.
# UT retargets only the disposable CodeArts copies and rejects version changes.
env:
  HUAWEICLOUD_NPM_REGISTRY: https://repo.huaweicloud.com/repository/npm/
  HUAWEICLOUD_PYPI_INDEX: https://repo.huaweicloud.com/repository/pypi/simple
  NPMMIRROR_PYTHON_INSTALL_MIRROR: https://registry.npmmirror.com/-/binary/python-build-standalone

concurrency:
  max: 5
  enable: false
  preemption:
    enable: false
    events:
    - mr_id
  exceed-action: IGNORE
sources:
  sciencediscovery:
    type: gitcode
    name: sciencediscovery
    branch: ci/verify-pr-ci
    git_url: https://gitcode.com/openJiuwen/sciencediscovery.git
    ssh_git_url: git@gitcode.com:openJiuwen/sciencediscovery.git
    endpoint_id: c4451a2a11af48baacd6b2af5eee3075
    repo_id: 10597680
# The four merge-request types are the GitCode equivalent of the GitHub
# workflow's opened/synchronize/reopened: `open` and `reopen` cover creating and
# reopening a merge request, `update` covers every later push to it, and `merge`
# fires once when it lands on main. code-update stays false so a settings-only
# change is checked too, matching how GitHub re-runs on every synchronize.
on:
  sources:
    sciencediscovery:
      merge_requests:
        branches:
        - main
        paths: []
        types:
        - open
        - update
        - merge
        - reopen
        branches-ignore: []
        paths-ignore: []
        code-update: false
stages:
  # The stage identifier was generated when pipeline 08f5be37851e45f9a2cbe41ea6dcb07a
  # was converted to a repository-hosted definition. Keep it verbatim so the
  # file still matches the pipeline record on the server.
  1787542687692903221df-b13e-4e04-a571-d9790b3d3f2d:
    jobs:
      ut:
        select: selected_by_default
        name: UT
        needs: []
        steps:
        - name: Download the source commit
          uses: official_git_clone
        - name: Provision the runner
          uses: official_shell_plugin
          with:
            OFFICIAL_SHELL_SCRIPT_INPUT: |
              set -eu
              SOURCE_DIR="${SHARE_PATH:?CodeArts did not set SHARE_PATH}"
              echo "source directory: $SOURCE_DIR"
              if [ ! -f "$SOURCE_DIR/pnpm-workspace.yaml" ]; then
                echo "FATAL: the download task did not create the expected source directory"
                ls -la "$SHARE_PATH" || true
                exit 1
              fi
              cd "$SOURCE_DIR"
              export CI_NPM_REGISTRY="${{ env.HUAWEICLOUD_NPM_REGISTRY }}"
              export CI_PYPI_INDEX="${{ env.HUAWEICLOUD_PYPI_INDEX }}"
              bash .ci/provision-runner.sh
        - name: Retarget Python lockfiles to Huawei mirror
          uses: official_shell_plugin
          with:
            OFFICIAL_SHELL_SCRIPT_INPUT: |
              set -eu
              cd "${SHARE_PATH:?CodeArts did not set SHARE_PATH}"
              export PATH="$HOME/.local/node/bin:$HOME/.local/share/pnpm:$HOME/.local/bin:$PATH"
              export UV_DEFAULT_INDEX="${{ env.HUAWEICLOUD_PYPI_INDEX }}"
              export UV_PYTHON_INSTALL_MIRROR="${{ env.NPMMIRROR_PYTHON_INSTALL_MIRROR }}"
              for PYTHON_PROJECT in services/gateway services/paper services/memory-graph; do
                LOCK_FILE="$PYTHON_PROJECT/uv.lock"
                echo "retargeting $LOCK_FILE to $UV_DEFAULT_INDEX"
                LOCKED_VERSIONS=$(sed -n -e '/^name = /p' -e '/^version = /p' "$LOCK_FILE")
                uv lock --project "$PYTHON_PROJECT"
                RETARGETED_VERSIONS=$(sed -n -e '/^name = /p' -e '/^version = /p' "$LOCK_FILE")
                if [ "$LOCKED_VERSIONS" != "$RETARGETED_VERSIONS" ]; then
                  echo "FATAL: retargeting $LOCK_FILE changed locked package versions" >&2
                  exit 1
                fi
              done
        - name: Run and report UT
          uses: official_shell_plugin
          with:
            OFFICIAL_SHELL_SCRIPT_INPUT: |
              set -eu
              cd "${SHARE_PATH:?CodeArts did not set SHARE_PATH}"
              export PATH="$HOME/.local/node/bin:$HOME/.local/share/pnpm:$HOME/.local/bin:$PATH"
              export CI_RESULTS_DIR="$PWD/.ci-results"
              export CI_RUNTIME_DIR="$HOME/ci-runtime-ut"
              export UV_DEFAULT_INDEX="${{ env.HUAWEICLOUD_PYPI_INDEX }}"
              export UV_PYTHON_INSTALL_MIRROR="${{ env.NPMMIRROR_PYTHON_INSTALL_MIRROR }}"
              echo "dependency mirrors: npm=$(npm config get registry), pypi=$UV_DEFAULT_INDEX, python=$UV_PYTHON_INSTALL_MIRROR"
              set +e
              pnpm ci:ut:core
              TEST_RC=$?
              set -e
              echo "=== UT run.log (last 80 lines) ==="
              tail -n 80 .ci-results/ut-core/run.log 2>/dev/null || echo "no run.log produced"
              exit "$TEST_RC"
        if: "${{ default() }}"
        runs-on:
        - ubuntu-latest
        - x64
        - large
      st:
        select: selected_by_default
        name: ST
        needs: []
        steps:
        - name: Download the source commit
          uses: official_git_clone
        - name: Provision the runner
          uses: official_shell_plugin
          with:
            OFFICIAL_SHELL_SCRIPT_INPUT: |
              set -eu
              SOURCE_DIR="${SHARE_PATH:?CodeArts did not set SHARE_PATH}"
              echo "source directory: $SOURCE_DIR"
              if [ ! -f "$SOURCE_DIR/pnpm-workspace.yaml" ]; then
                echo "FATAL: the download task did not create the expected source directory"
                ls -la "$SHARE_PATH" || true
                exit 1
              fi
              cd "$SOURCE_DIR"
              export CI_NPM_REGISTRY="${{ env.HUAWEICLOUD_NPM_REGISTRY }}"
              export CI_PYPI_INDEX="${{ env.HUAWEICLOUD_PYPI_INDEX }}"
              bash .ci/provision-runner.sh
        # The hermetic agent loop drives a scripted local endpoint and performs
        # a real workspace tool round trip without a model credential.
        - name: Run and report ST
          uses: official_shell_plugin
          with:
            OFFICIAL_SHELL_SCRIPT_INPUT: |
              set -eu
              cd "${SHARE_PATH:?CodeArts did not set SHARE_PATH}"
              export PATH="$HOME/.local/node/bin:$HOME/.local/share/pnpm:$HOME/.local/bin:$PATH"
              export CI_RESULTS_DIR="$PWD/.ci-results"
              export CI_RUNTIME_DIR="$HOME/ci-runtime-st"
              export UV_DEFAULT_INDEX="${{ env.HUAWEICLOUD_PYPI_INDEX }}"
              export UV_PYTHON_INSTALL_MIRROR="${{ env.NPMMIRROR_PYTHON_INSTALL_MIRROR }}"
              echo "dependency mirrors: npm=$(npm config get registry), pypi=$UV_DEFAULT_INDEX, python=$UV_PYTHON_INSTALL_MIRROR"
              set +e
              pnpm ci:st
              TEST_RC=$?
              set -e
              echo "=== ST run.log (last 80 lines) ==="
              tail -n 80 .ci-results/st/run.log 2>/dev/null || echo "no run.log produced"
              exit "$TEST_RC"
        if: "${{ default() }}"
        runs-on:
        - ubuntu-latest
        - x64
        - large
    pre:
    - type: auto
    name: CI
    select: selected_by_default
    fail-fast: false
