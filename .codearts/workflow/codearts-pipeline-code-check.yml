# Reusable CodeArts child pipeline for the PR-oriented code checks. Pipeline
# 08f5be37851e45f9a2cbe41ea6dcb07a invokes the registered child pipeline
# 3a80cbaf5dec4e0b8804ce1401787f5f; PR labels and the final result comment are
# deliberately owned by the parent so that the whole CI run publishes once.
concurrency:
  max: 120
  enable: true
  preemption:
    enable: true
    events:
    - mr_id
  exceed-action: QUEUE
sources:
  sciencediscovery:
    type: gitcode
    name: sciencediscovery
    branch: main
    git_url: https://gitcode.com/openJiuwen/sciencediscovery.git
    ssh_git_url: git@gitcode.com:openJiuwen/sciencediscovery.git
    endpoint_id: c4451a2a11af48baacd6b2af5eee3075
    repo_id: 10597680
inputs:
  PR_ID:
    type: string
    default: "${MERGE_ID}"
    manual_override: true
  repo_url:
    type: string
    description: ""
    default: "${REPO_URL}"
    manual_override: true
  branch:
    type: string
    description: ""
    default: "${test-agentcore_REPOSITORY_BRANCH}"
    manual_override: true
  repo_name:
    type: string
    description: ""
    default: "${test-agentcore_REPOSITORY_NAME}"
    manual_override: true
  pipeline_name:
    type: string
    description: ""
    default: "${PIPELINE_NAME}"
    manual_override: true
  number:
    type: string
    default: "${PR_ID}"
    manual_override: true
  webhook_payload:
    type: string
    description: 中软蓝区看板对接参数
    default: "${WEBHOOK_PAYLOAD}"
    manual_override: true
stages:
  1760954519095a0a4b18d-315d-432b-9eec-5651a0eb2e69:
    jobs:
      JOB_EcFGE:
        select: always
        name: sca
        needs: []
        steps:
        - name: sca
          uses: official_devcloud_cloudBuild
          with:
            PR_ID: "${PR_ID}"
            WEBHOOK_PAYLOAD: "${webhook_payload}"
            __sameProject__: "true"
            __projectId__: ""
            jobId: c1ef4206098b4d99b1c432da03f17dd0
            __repository__: sciencediscovery
            artifactIdentifier: ""
          identifier: 1764647095502eb216dce-61de-4e13-a72c-276122edbc0e
        if: "${{ default() }}"
        runs-on:
        - default
      JOB_KEeZj:
        select: always
        name: anti_poison
        needs: []
        steps:
        - name: anti_poison
          uses: official_devcloud_cloudBuild
          with:
            PR_ID: "${PR_ID}"
            WEBHOOK_PAYLOAD: "${webhook_payload}"
            __sameProject__: "true"
            __projectId__: ""
            jobId: 53e717c466a14436b392f15c6ebde40e
            __repository__: sciencediscovery
            artifactIdentifier: ""
          identifier: 1764647129551a5082829-073c-4a34-8f03-3bb993cb9c33
        if: "${{ default() }}"
        runs-on:
        - default
      JOB_WkYCJ:
        select: always
        name: codecheck
        needs: []
        steps:
        - name: codecheck
          uses: official_devcloud_cloudBuild
          with:
            PR_ID: "${PR_ID}"
            WEBHOOK_PAYLOAD: "${webhook_payload}"
            __sameProject__: "true"
            __projectId__: ""
            jobId: 575680bcb5f84720adda7a7f3d330359
            __repository__: sciencediscovery
            artifactIdentifier: ""
          identifier: 177011952628853cc9abb-064c-49ab-95e9-2666363f6d56
        if: "${{ default() }}"
        runs-on:
        - default
      JOB_BwBjf:
