          identifier: 1788333000000b5322962-5b09-4837-9697-31028b7fb4f3
        - name: Fetch and verify toolchain resources
          uses: official_shell_plugin
          with:
            OFFICIAL_SHELL_SCRIPT_INPUT: |
              set -eu
              cd "${SHARE_PATH:?CodeArts did not set SHARE_PATH}"
              bash .ci/prepare-codearts-resources.sh \
                --group toolchains \
                --output-dir "$PWD/.codearts-resources"
              find .codearts-resources/toolchains -maxdepth 1 -type f -printf '%f\n' | sort
