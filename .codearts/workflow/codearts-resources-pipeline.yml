concurrency:
  max: 5
  enable: false
  preemption:
    enable: false
    events:
    - mr_id
  exceed-action: IGNORE
sources:
  sciencediscovery:
    type: gitcode
    name: sciencediscovery
    branch: ci/codearts-resources
    git_url: https://gitcode.com/openJiuwen/sciencediscovery.git
    ssh_git_url: git@gitcode.com:openJiuwen/sciencediscovery.git
    endpoint_id: c4451a2a11af48baacd6b2af5eee3075
    repo_id: 10597680
on:
  sources:
    sciencediscovery:
      push:
        branches:
        - ci/codearts-resources
        paths: []
        branches-ignore: []
        paths-ignore: []
stages:
  1788331666501d867d3e2-fed6-4ab8-83fe-34886f33f885:
    jobs:
      resource_toolchains:
        select: selected_by_default
        name: Prepare toolchain resources
        needs: []
        timeout: 30
        timeout_unit: minute
        steps:
        - name: Fetch and publish the verified toolchains
          uses: official_devcloud_cloudBuild
          with:
            GIT_REPO_URL: https://gitcode.com/openJiuwen/sciencediscovery.git
            GIT_REF: refs/heads/ci/codearts-resources
            GIT_TARGET_REF: refs/heads/ci/codearts-resources
            SH_FILE_PATH: .ci/codearts-resource.sh
            ARTIFACT_PATH: .ci-results/publish
            OBS_BUCKET: openjiuwen-ci
            OBS_DIRECTORY: sciencediscovery/cache/toolchains/v1/
            OBS_ENDPOINT: obs.cn-north-4.myhuaweicloud.com
            ENVS: |-
              RESOURCE_BUILD_RUN_ID=${{ pipeline.run_id }}
            ARGS: |-
              toolchains
            __sameProject__: "true"
            __projectId__: ""
            jobId: d84e08c4eee04564a45ecf3e00579b88
            __repository__: sciencediscovery
            artifactIdentifier: ""
          identifier: 1788620000000a1b2c3d4-2001-4aaa-9001-0a1b2c3d4e11
        if: "${{ default() }}"
        runs-on:
        - default
      resource_qemu:
        select: selected_by_default
        name: Prepare QEMU Ubuntu image
        needs: []
        timeout: 30
        timeout_unit: minute
        steps:
        - name: Fetch and publish the verified base image
          uses: official_devcloud_cloudBuild
          with:
            GIT_REPO_URL: https://gitcode.com/openJiuwen/sciencediscovery.git
            GIT_REF: refs/heads/ci/codearts-resources
            GIT_TARGET_REF: refs/heads/ci/codearts-resources
            SH_FILE_PATH: .ci/codearts-resource.sh
            ARTIFACT_PATH: .ci-results/publish
            OBS_BUCKET: openjiuwen-ci
            OBS_DIRECTORY: sciencediscovery/cache/qemu/v1/
            OBS_ENDPOINT: obs.cn-north-4.myhuaweicloud.com
            ENVS: |-
              RESOURCE_BUILD_RUN_ID=${{ pipeline.run_id }}
            ARGS: |-
              qemu-base
            __sameProject__: "true"
            __projectId__: ""
            jobId: d84e08c4eee04564a45ecf3e00579b88
            __repository__: sciencediscovery
            artifactIdentifier: ""
          identifier: 1788620000001b2c3d4e5-2002-4aaa-9002-1b2c3d4e5f12
        if: "${{ default() }}"
        runs-on:
        - default
      resource_qemu_emulator:
        select: selected_by_default
        name: Build portable QEMU emulator
        needs: []
        timeout: 30
        timeout_unit: minute
        steps:
        - name: Build and publish the portable emulator
          uses: official_devcloud_cloudBuild
          with:
            GIT_REPO_URL: https://gitcode.com/openJiuwen/sciencediscovery.git
            GIT_REF: refs/heads/ci/codearts-resources
            GIT_TARGET_REF: refs/heads/ci/codearts-resources
            SH_FILE_PATH: .ci/codearts-resource.sh
            ARTIFACT_PATH: .ci-results/publish
            OBS_BUCKET: openjiuwen-ci
            OBS_DIRECTORY: sciencediscovery/cache/qemu-emulator/v1/
            OBS_ENDPOINT: obs.cn-north-4.myhuaweicloud.com
            ENVS: |-
              RESOURCE_BUILD_RUN_ID=${{ pipeline.run_id }}
            ARGS: |-
              qemu-emulator
            __sameProject__: "true"
            __projectId__: ""
            jobId: d84e08c4eee04564a45ecf3e00579b88
            __repository__: sciencediscovery
            artifactIdentifier: ""
          identifier: 1788620000002c3d4e5f6-2003-4aaa-9003-2c3d4e5f6a13
        if: "${{ default() }}"
        runs-on:
        - default
      resource_qemu_runner:
        select: selected_by_default
        name: Build pre-provisioned QEMU Runner image
        needs:
        - resource_toolchains
        - resource_qemu
        timeout: 90
        timeout_unit: minute
        steps:
        - name: Build and publish the Runner image
          uses: official_devcloud_cloudBuild
          with:
            GIT_REPO_URL: https://gitcode.com/openJiuwen/sciencediscovery.git
            GIT_REF: refs/heads/ci/codearts-resources
            GIT_TARGET_REF: refs/heads/ci/codearts-resources
            SH_FILE_PATH: .ci/codearts-resource.sh
            ARTIFACT_PATH: .ci-results/publish
            OBS_BUCKET: openjiuwen-ci
            OBS_DIRECTORY: "sciencediscovery/cache/qemu-runner/v2/${{ pipeline.run_id }}/"
            OBS_ENDPOINT: obs.cn-north-4.myhuaweicloud.com
            ENVS: |-
              RESOURCE_BUILD_RUN_ID=${{ pipeline.run_id }}
            ARGS: |-
              qemu-runner
            __sameProject__: "true"
            __projectId__: ""
            jobId: d84e08c4eee04564a45ecf3e00579b88
            __repository__: sciencediscovery
            artifactIdentifier: ""
          identifier: 1788620000003d4e5f6a7-2004-4aaa-9004-3d4e5f6a7b14
        if: "${{ default() }}"
        runs-on:
        - default
      resource_verify:
        select: selected_by_default
        name: Verify the published resources
        needs:
        - resource_qemu_emulator
        - resource_qemu_runner
        timeout: 40
        timeout_unit: minute
        steps:
        - name: Read the published artifacts back out of OBS
          uses: official_devcloud_cloudBuild
          with:
            GIT_REPO_URL: https://gitcode.com/openJiuwen/sciencediscovery.git
            GIT_REF: refs/heads/ci/codearts-resources
            GIT_TARGET_REF: refs/heads/ci/codearts-resources
            SH_FILE_PATH: .ci/codearts-resource.sh
            ARTIFACT_PATH: .ci-results/publish
            OBS_BUCKET: openjiuwen-ci
            OBS_DIRECTORY: "sciencediscovery/cache/qemu-runner/v2/${{ pipeline.run_id }}/verify/"
            OBS_ENDPOINT: obs.cn-north-4.myhuaweicloud.com
            ENVS: |-
              RESOURCE_BUILD_RUN_ID=${{ pipeline.run_id }}
            ARGS: |-
              verify
            __sameProject__: "true"
            __projectId__: ""
            jobId: d84e08c4eee04564a45ecf3e00579b88
            __repository__: sciencediscovery
            artifactIdentifier: ""
          identifier: 1788620000004e5f6a7b8-2005-4aaa-9005-4e5f6a7b8c15
        if: "${{ default() }}"
        runs-on:
        - default
    pre:
    - type: auto
    name: Prepare immutable resources
    select: selected_by_default
    fail-fast: false
