        if: "${{ default() }}"
        runs-on:
        - codearts-hosted
        - ubuntu-latest
        - x64
        - large
      resource_qemu:
        select: selected_by_default
        name: Prepare QEMU Ubuntu image
        needs: []
        timeout: 40
        timeout_unit: minute
        steps:
        - name: Download the resource branch
          uses: official_git_clone
          identifier: 1788333000011c5892c74-b0a2-4566-827c-a90eb779e428
        - name: Fetch and verify the QEMU image
          uses: official_shell_plugin
          with:
            OFFICIAL_SHELL_SCRIPT_INPUT: |
              set -eu
              cd "${SHARE_PATH:?CodeArts did not set SHARE_PATH}"
              bash .ci/prepare-codearts-resources.sh \
                --group qemu \
                --output-dir "$PWD/.codearts-resources"
              ls -lh .codearts-resources/qemu/noble-server-cloudimg-amd64.img
          identifier: 1788333000012c5948720-6c76-4b9f-8e5f-1f58c95bbe40
        - name: Upload the QEMU Ubuntu image
          uses: upload-obs
          with:
            endpoint_select: f4cb5fdf6d5d498eaa28721bc30beb0c
            endpoint: obs.cn-north-4.myhuaweicloud.com
            bucket: openjiuwen-ci
            key: sciencediscovery/cache/qemu/v1/noble-server-cloudimg-amd64.img
            source_file: "${SHARE_PATH}/.codearts-resources/qemu/noble-server-cloudimg-amd64.img"
            self_folder: "false"
          identifier: 1788333000013ada5e1eb-cefa-4408-8963-9cb5162b07f4
        if: "${{ default() }}"
        runs-on:
        - codearts-hosted
        - ubuntu-latest
        - x64
        - large
      resource_qemu_runner:
        select: selected_by_default
        name: Build pre-provisioned QEMU Runner image
        needs:
        - resource_toolchains
        - resource_qemu
        timeout: 60
        timeout_unit: minute
        steps:
        - name: Download the resource branch
          uses: official_git_clone
          identifier: 1788339000000cf34f086-818d-4e2b-a6b4-6732de7c55e8
        - name: Build and verify the QEMU Runner image
          uses: official_shell_plugin
          with:
            OFFICIAL_SHELL_SCRIPT_INPUT: |
              set -eu
              cd "${SHARE_PATH:?CodeArts did not set SHARE_PATH}"
              BASE_DIR="$PWD/.codearts-resources/qemu-base"
              OUTPUT_DIR="$PWD/.codearts-resources/qemu-runner"
              CHECKED_OUT_COMMIT=$(git rev-parse HEAD)
              RESOURCE_RUN_ID="${{ pipeline.run_id }}"
              printf '%s\n' "$CHECKED_OUT_COMMIT" | grep -Eq '^[0-9a-f]{40}$'
              printf '%s\n' "$RESOURCE_RUN_ID" | grep -Eq '^[0-9A-Za-z_-]+$'
              mkdir -p "$BASE_DIR" "$OUTPUT_DIR"
              CI_QEMU_IMAGE_CACHE_URL="https://openjiuwen-ci.obs.cn-north-4.myhuaweicloud.com/sciencediscovery/cache/qemu/v1" \
                CI_QEMU_IMAGE_CACHE_ONLY=1 \
                bash .ci/fetch-qemu-image.sh \
                  --output "$BASE_DIR/noble-server-cloudimg-amd64.img"
              RESOURCE_BUILD_COMMIT="$CHECKED_OUT_COMMIT" \
                RESOURCE_BUILD_RUN_ID="$RESOURCE_RUN_ID" \
                bash .ci/build-qemu-runner-image.sh \
                  --base-image "$BASE_DIR/noble-server-cloudimg-amd64.img" \
                  --output-dir "$OUTPUT_DIR"
              (cd "$OUTPUT_DIR" && sha256sum --check SHA256SUMS)
              ls -lh "$OUTPUT_DIR/ScienceDiscovery-qemu-runner-noble-amd64.qcow2"
          identifier: 17883390000017f2349b5-edfc-4995-a66d-c93558b1527e
        - name: Require the local QEMU Runner outputs
          uses: official_shell_plugin
          with:
            OFFICIAL_SHELL_SCRIPT_INPUT: |
              set -eu
              cd "${SHARE_PATH:?CodeArts did not set SHARE_PATH}"
              OUTPUT_DIR="$PWD/.codearts-resources/qemu-runner"
              test -s "$OUTPUT_DIR/ScienceDiscovery-qemu-runner-noble-amd64.qcow2"
              test -s "$OUTPUT_DIR/SHA256SUMS"
              test -s "$OUTPUT_DIR/VERSION"
              (cd "$OUTPUT_DIR" && sha256sum --check SHA256SUMS)
              CHECKED_OUT_COMMIT=$(git rev-parse HEAD)
              RESOURCE_RUN_ID="${{ pipeline.run_id }}"
              cat "$OUTPUT_DIR/VERSION"
              grep -Fx 'recipe=qemu-runner-v1' "$OUTPUT_DIR/VERSION"
              grep -Fx "resource_commit=$CHECKED_OUT_COMMIT" "$OUTPUT_DIR/VERSION"
              grep -Fx "resource_run_id=$RESOURCE_RUN_ID" "$OUTPUT_DIR/VERSION"
          identifier: 1788342000000b5065903-e34b-4dfb-ae0d-08c597d9332e
        - name: Upload the pre-provisioned QEMU Runner image
          uses: upload-obs
          with:
            endpoint_select: f4cb5fdf6d5d498eaa28721bc30beb0c
            endpoint: obs.cn-north-4.myhuaweicloud.com
            bucket: openjiuwen-ci
            key: "sciencediscovery/cache/qemu-runner/v1/${{ sources.sciencediscovery.commit_id }}/${{ pipeline.run_id }}/ScienceDiscovery-qemu-runner-noble-amd64.qcow2"
            source_file: "${SHARE_PATH}/.codearts-resources/qemu-runner/ScienceDiscovery-qemu-runner-noble-amd64.qcow2"
            self_folder: "false"
          identifier: 1788339000002c0324e96-4825-4922-9500-29339cf5ea30
        - name: Upload the QEMU Runner checksum
          uses: upload-obs
          with:
            endpoint_select: f4cb5fdf6d5d498eaa28721bc30beb0c
            endpoint: obs.cn-north-4.myhuaweicloud.com
            bucket: openjiuwen-ci
            key: "sciencediscovery/cache/qemu-runner/v1/${{ sources.sciencediscovery.commit_id }}/${{ pipeline.run_id }}/SHA256SUMS"
            source_file: "${SHARE_PATH}/.codearts-resources/qemu-runner/SHA256SUMS"
            self_folder: "false"
          identifier: 1788339000003b67898c8-7503-4c2d-935e-4fa40de09d5a
        - name: Upload the QEMU Runner version manifest
          uses: upload-obs
          with:
            endpoint_select: f4cb5fdf6d5d498eaa28721bc30beb0c
            endpoint: obs.cn-north-4.myhuaweicloud.com
            bucket: openjiuwen-ci
            key: "sciencediscovery/cache/qemu-runner/v1/${{ sources.sciencediscovery.commit_id }}/${{ pipeline.run_id }}/VERSION"
            source_file: "${SHARE_PATH}/.codearts-resources/qemu-runner/VERSION"
            self_folder: "false"
          identifier: 1788339000004c48cc4ca-6e64-4481-8427-c8d12d625f17
        - name: Verify the published QEMU Runner artifacts
          uses: official_shell_plugin
          with:
            OFFICIAL_SHELL_SCRIPT_INPUT: |
              set -eu
              cd "${SHARE_PATH:?CodeArts did not set SHARE_PATH}"
              BASE_URL="https://openjiuwen-ci.obs.cn-north-4.myhuaweicloud.com/sciencediscovery/cache/qemu-runner/v1/${{ sources.sciencediscovery.commit_id }}/${{ pipeline.run_id }}"
              VERIFY_DIR="$PWD/.codearts-resources/qemu-runner-published"
              IMAGE_NAME=ScienceDiscovery-qemu-runner-noble-amd64.qcow2
              mkdir -p "$VERIFY_DIR"
              fetch_published() {
                name="$1"
                attempt=1
                while [ "$attempt" -le 5 ]; do
                  if curl --fail --location --retry 2 --connect-timeout 15 \
                    --max-time 600 --silent --show-error \
                    "$BASE_URL/$name" --output "$VERIFY_DIR/$name.part"; then
                    mv "$VERIFY_DIR/$name.part" "$VERIFY_DIR/$name"
                    echo "Downloaded published QEMU Runner object: $name"
                    return 0
                  fi
                  rm -f "$VERIFY_DIR/$name.part"
                  echo "Waiting for published QEMU Runner object: $name (attempt $attempt)"
                  attempt=$((attempt + 1))
                  sleep 2
                done
                echo "FATAL: published QEMU Runner object is unavailable: $name" >&2
                return 1
              }
              fetch_published SHA256SUMS
              fetch_published VERSION
              fetch_published "$IMAGE_NAME"
              test "$(wc -l < "$VERIFY_DIR/SHA256SUMS")" -eq 1
              grep -Eq "^[0-9a-f]{64}  $IMAGE_NAME$" "$VERIFY_DIR/SHA256SUMS"
              expected_sha256=$(awk '{print $1}' "$VERIFY_DIR/SHA256SUMS")
              actual_sha256=$(sha256sum "$VERIFY_DIR/$IMAGE_NAME" | awk '{print $1}')
              test "$actual_sha256" = "$expected_sha256"
              CHECKED_OUT_COMMIT=$(git rev-parse HEAD)
              RESOURCE_RUN_ID="${{ pipeline.run_id }}"
              cat "$VERIFY_DIR/VERSION"
              grep -Fx 'recipe=qemu-runner-v1' "$VERIFY_DIR/VERSION"
              grep -Fx "resource_commit=$CHECKED_OUT_COMMIT" "$VERIFY_DIR/VERSION"
              grep -Fx "resource_run_id=$RESOURCE_RUN_ID" "$VERIFY_DIR/VERSION"
              echo "Verified published QEMU Runner image: $actual_sha256"
          identifier: 17883420000013956977a-b91c-4668-ac74-b45993800807
        if: "${{ default() }}"
        runs-on:
        - codearts-hosted
        - ubuntu-latest
        - x64
        - large
    pre:
    - type: auto
    name: Prepare immutable resources
    select: selected_by_default
    fail-fast: false
