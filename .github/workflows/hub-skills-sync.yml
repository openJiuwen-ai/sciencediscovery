# Freezes the separate MindScienceSkills repository into the
# `external-skills/` prefix of the OBS bucket, then asks `hub-publish` to
# rebuild the site.
#
# Nothing is written to this repository and no pull request is opened: the
# snapshot is the only delivery channel. The sync script builds the whole
# snapshot in memory and writes it only after every skill was fetched and
# parsed, so a failure leaves the previous snapshot (and the site) untouched.
# Upload order matters as well: the tarball lands first, the index last, so an
# interrupted upload never points at a missing file.

name: Hub skills sync

on:
  schedule:
    # Weekly, before the Monday site rebuild reads the snapshot.
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: hub-skills-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync the external skills snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Fetch skills and build the snapshot
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: pnpm hub:sync-skills --out .hub-cache/external-skills

      - name: Configure obsutil
        env:
          OBS_AK: ${{ secrets.OBS_AK }}
          OBS_ENDPOINT: ${{ secrets.OBS_ENDPOINT }}
          OBS_SK: ${{ secrets.OBS_SK }}
          OBS_BUCKET: ${{ secrets.OBS_BUCKET }}
        run: |
          curl -sSfL -o /tmp/obsutil.tar.gz https://obs-community.obs.cn-north-1.myhuaweicloud.com/obsutil/current/obsutil_linux_amd64.tar.gz
          tar -xzf /tmp/obsutil.tar.gz -C /tmp
          OBSUTIL=$(find /tmp -type f -name obsutil -perm -u+x | head -1)
          chmod +x "$OBSUTIL"
          echo "$(dirname "$OBSUTIL")" >> "$GITHUB_PATH"
          "$OBSUTIL" config -i="$OBS_AK" -k="$OBS_SK" -e="$OBS_ENDPOINT"
          echo "OBS_BUCKET=$OBS_BUCKET" >> "$GITHUB_ENV"

      - name: Upload the snapshot
        run: |
          obsutil cp .hub-cache/external-skills/snapshot.tar.gz \
            "obs://$OBS_BUCKET/external-skills/snapshot.tar.gz" -f
          obsutil cp .hub-cache/external-skills/index.json \
            "obs://$OBS_BUCKET/external-skills/index.json" -f

      - name: Rebuild the site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run hub-publish.yml --ref "${{ github.ref_name }}"
