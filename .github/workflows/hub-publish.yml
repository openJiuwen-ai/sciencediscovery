# Publishes the static hub to the `site/` prefix of the public-read OBS bucket.
#
# Two independent paths share one job because they both rewrite `site/`:
# - automatic (push to main, weekly): rebuild the four repository asset kinds
#   and sync `site/`; never reads or writes `sessions/`;
# - manual (`workflow_dispatch`, "publish_sessions"): validate the staged
#   session drop, merge its entries into the published `sessions/index.json`,
#   upload the new packages and the index, then rebuild the site.
#
# The session drop is deliberately not in the repository. A manual run reads
# `hub-sessions/` from the runner workspace, so stage it there first (a
# self-hosted runner, or a checkout step that pulls the private data
# repository) before dispatching with "publish_sessions" enabled.
#
# The uploads hold the only credentials: AK/SK are written to obsutil's own
# config file in the configure step and are never put in the site, the catalog
# or an environment variable that later steps can print.

name: Hub publish

on:
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "packages/specialist/**"
      - "packages/mcp-sources/**"
      - "packages/research-package/**"
      - "apps/hub/**"
      - "scripts/hub/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/hub-publish.yml"
  schedule:
    # Weekly backstop: the site still refreshes when no repository change
    # arrived, and it re-reads whatever snapshot the sync workflow uploaded.
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      publish_sessions:
        description: "Publish the session packages staged in hub-sessions/"
        type: boolean
        default: false
      unpublish:
        description: "Session package ids to unpublish, comma separated"
        type: string
        default: ""

permissions:
  contents: read

# A manual publish must not interleave with an automatic one: both delete and
# rewrite the same `site/` prefix.
concurrency:
  group: hub-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Build and sync the static site
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PUBLISH_SESSIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_sessions }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Configure obsutil
        env:
          OBS_AK: ${{ secrets.OBS_AK }}
          OBS_ENDPOINT: ${{ secrets.OBS_ENDPOINT }}
          OBS_SK: ${{ secrets.OBS_SK }}
          OBS_BUCKET: ${{ secrets.OBS_BUCKET }}
          HUB_BASE_URL: ${{ vars.HUB_BASE_URL }}
        run: |
          curl -sSfL -o /tmp/obsutil.tar.gz https://obs-community.obs.cn-north-1.myhuaweicloud.com/obsutil/current/obsutil_linux_amd64.tar.gz
          tar -xzf /tmp/obsutil.tar.gz -C /tmp
          OBSUTIL=$(find /tmp -type f -name obsutil -perm -u+x | head -1)
          chmod +x "$OBSUTIL"
          echo "$(dirname "$OBSUTIL")" >> "$GITHUB_PATH"
          "$OBSUTIL" config -i="$OBS_AK" -k="$OBS_SK" -e="$OBS_ENDPOINT"

          # `HUB_BASE_URL` is the custom domain in production. Without it, use
          # the static website domain, not the object domain: the detail page
          # fetches README.md, and both the page and the sessions prefix must
          # share one origin or that fetch needs bucket CORS.
          host="${OBS_ENDPOINT#https://}"
          host="${host#http://}"
          case "$host" in
            obs.*) website="obs-website.${host#obs.}" ;;
            *) website="$host" ;;
          esac
          if [ -n "$HUB_BASE_URL" ]; then
            base="${HUB_BASE_URL%/}"
          else
            base="https://${OBS_BUCKET}.${website}"
          fi
          echo "OBS_BUCKET=$OBS_BUCKET" >> "$GITHUB_ENV"
          echo "HUB_BUCKET_BASE=$base" >> "$GITHUB_ENV"

      # Session publication resolves `related` ids against the catalog, so the
      # catalog must exist before the drop is validated.
      - name: Export catalog
        env:
          HUB_EXTERNAL_SKILLS_URL: ${{ env.HUB_BUCKET_BASE }}/external-skills
          HUB_SESSIONS_BASE_URL: ${{ env.HUB_BUCKET_BASE }}/sessions
          HUB_SESSIONS_INDEX_URL: ${{ env.HUB_BUCKET_BASE }}/sessions/index.json
        run: pnpm hub:export

      # A dispatch that publishes sessions but staged nothing is almost always
      # a missing checkout step, not an intentional rebuild.
      - name: Check the session drop
        if: env.PUBLISH_SESSIONS == 'true'
        run: |
          packages=$(find hub-sessions -maxdepth 1 -name '*.sdresearch' 2>/dev/null | wc -l)
          if [ "$packages" -eq 0 ] && [ -z "${{ inputs.unpublish }}" ]; then
            echo "::error::hub-sessions/ has no .sdresearch packages; stage the drop or leave publish_sessions unchecked"
            exit 1
          fi

      - name: Publish session packages
        if: env.PUBLISH_SESSIONS == 'true'
        env:
          HUB_SESSIONS_INDEX_URL: ${{ env.HUB_BUCKET_BASE }}/sessions/index.json
        run: |
          # The published index is read from OBS (public read, no credentials)
          # and merged by id, so this run only needs the new packages. A 404
          # means nothing was published yet and starts an empty index.
          pnpm hub:publish-sessions \
            --sessions hub-sessions \
            --out .hub-cache/session-publish \
            --catalog apps/hub/public/catalog.json \
            --previous-index "$HUB_SESSIONS_INDEX_URL" \
            --unpublish "${{ inputs.unpublish }}" \
            --base-url "$HUB_BUCKET_BASE/sessions"

          root=.hub-cache/session-publish/sessions
          # Packages first, README next, index last: an interrupted upload then
          # leaves the old index in place instead of advertising missing files.
          while IFS= read -r -d '' package; do
            name=$(basename "$package")
            # A direct URL downloads instead of previewing an unknown type.
            obsutil cp "$package" "obs://$OBS_BUCKET/sessions/$name" -f \
              -meta="Content-Type:application/octet-stream#Content-Disposition:attachment"
          done < <(find "$root" -maxdepth 1 -name '*.sdresearch' -print0)
          while IFS= read -r -d '' readme; do
            relative=${readme#"$root"/}
            obsutil cp "$readme" "obs://$OBS_BUCKET/sessions/$relative" -f
          done < <(find "$root" -mindepth 2 -maxdepth 2 -name README.md -print0)
          obsutil cp "$root/index.json" "obs://$OBS_BUCKET/sessions/index.json" -f

      - name: Rebuild catalog after publishing
        if: env.PUBLISH_SESSIONS == 'true'
        env:
          HUB_EXTERNAL_SKILLS_URL: ${{ env.HUB_BUCKET_BASE }}/external-skills
          HUB_SESSIONS_BASE_URL: ${{ env.HUB_BUCKET_BASE }}/sessions
          HUB_SESSIONS_INDEX_URL: ${{ env.HUB_BUCKET_BASE }}/sessions/index.json
        run: pnpm hub:export

      - name: Build site
        env:
          # The website endpoint serves the default page from `site/index.html`,
          # so every asset and data URL is rooted under `/site/`.
          HUB_BASE_PATH: /site/
        run: pnpm --filter @sciencediscovery/hub build

      - name: Sync site to OBS
        run: |
          # Wipe first so a renamed asset cannot linger, then upload. The
          # first publish has no `site/` prefix yet, hence `|| true`.
          # Upload `dist/`, not `public/`: Vite copies `public/` into `dist/`
          # and adds `index.html` and the hashed bundle, so `public/` alone
          # has no entry page and no JS.
          obsutil rm "obs://$OBS_BUCKET/site/" -r -f || true
          obsutil cp ./apps/hub/dist/ "obs://$OBS_BUCKET/site/" -r -f
          obsutil cp ./apps/hub/dist/index.html "obs://$OBS_BUCKET/site/index.html" -f \
            -meta="Content-Type:text/html"
