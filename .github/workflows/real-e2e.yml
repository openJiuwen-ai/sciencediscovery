# One real suite, two caller dependency graphs: L3 waits for L2; L4/L5 do not.
name: Real E2E

on:
  workflow_call:
    inputs:
      profile:
        description: "Routed real profile: merge, daily or release"
        required: true
        type: string
      backend:
        description: "Independent execution backend"
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  real-plan:
    name: Freeze real E2E matrix
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: nightly-ci-ds
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      attempts: ${{ steps.matrix.outputs.attempts }}
    env:
      CI_PROFILE: ${{ inputs.profile }}
      CI_E2E_BACKEND: ${{ inputs.backend }}
      # L5 exit evidence: every real case runs three independent times.
      CI_REAL_ATTEMPTS: "3"
      E2E_LLM_MODEL: ${{ vars.E2E_LLM_MODEL }}
      E2E_JUDGE_MODEL: ${{ vars.E2E_JUDGE_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - uses: actions/download-artifact@v4
        if: ${{ inputs.profile == 'merge' }}
        with:
          name: mocked-e2e-plan
          path: .ci-mocked-plan
      - uses: actions/download-artifact@v4
        if: ${{ inputs.profile == 'merge' }}
        with:
          pattern: mocked-e2e-results-*
          path: .ci-mocked-results
      - name: Require complete mocked results before L3 real API calls
        if: ${{ inputs.profile == 'merge' }}
        run: node .ci/mocked-report.mjs .ci-mocked-plan/plan.json .ci-mocked-results
      # Node collection imports tsx from the workspace, not the Playwright install.
      - run: pnpm install --frozen-lockfile
      - run: node test/sync-e2e.mjs --write
      - run: npm ci --prefix .e2e
      # Collection makes no API/model call and needs no credential.
      - run: node test/support/tagged/shared.mjs list --profile "$CI_PROFILE" --slice e2e-real --output .ci-real-plan
      - id: matrix
        run: node .ci/real-matrix.mjs .ci-real-plan/plan.json
      - uses: actions/upload-artifact@v4
        with:
          name: real-e2e-plan
          path: .ci-real-plan/plan.json
          # A re-run keeps the previous attempt. Downloading this name can then
          # return the older package, so replace it.
          overwrite: true
          include-hidden-files: true
          if-no-files-found: error
      - name: Upload real E2E collection diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-e2e-collection-diagnostics
          path: .ci-real-plan
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  real-e2e:
    name: Real E2E (${{ matrix.shard }}, attempt ${{ matrix.attempt }})
    needs: real-plan
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.real-plan.result == 'success' }}
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.real-plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    environment: nightly-ci-ds
    env:
      CI_ALLOW_REAL: "1"
      CI_PROFILE: ${{ inputs.profile }}
      CI_E2E_BACKEND: ${{ inputs.backend }}
      CI_REAL_SHARD: ${{ matrix.shard }}
      E2E_COMMIT_SHA: ${{ github.sha }}
      CI_RESULTS_DIR: ${{ github.workspace }}/.ci-results
      CI_RUNTIME_DIR: ${{ github.workspace }}/.ci-runtime/real-e2e
      CI_PREPARE_BIOMNI: ${{ matrix.prepareBiomni && '1' || '0' }}
      E2E_LLM_BASE_URL: ${{ vars.E2E_LLM_BASE_URL }}
      E2E_LLM_MODEL: ${{ vars.E2E_LLM_MODEL }}
      E2E_LLM_TOKEN: ${{ secrets.E2E_LLM_TOKEN }}
      E2E_JUDGE_BASE_URL: ${{ vars.E2E_JUDGE_BASE_URL }}
      E2E_JUDGE_MODEL: ${{ vars.E2E_JUDGE_MODEL }}
      E2E_JUDGE_TOKEN: ${{ secrets.E2E_JUDGE_TOKEN }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
      E2E_DRB_EVALUATION: full
      E2E_BIOMNI_EVALUATION: rubric
      # The L5 exit report needs the puct-artifact-review-v1 score on every attempt.
      E2E_PUCT_LLM_EVALUATION: "1"
      E2E_DRB_MAX_SUBAGENTS: "2"
      E2E_TEAM_CONCURRENCY_HINT: "2"
      E2E_DRB_RUN_TIMEOUT_MS: "3600000"
      # RACE and FACT share this deadline. Forty minutes lets citation checking finish.
      E2E_DRB_EVAL_TIMEOUT_MS: "2400000"
      E2E_TEAM_RUN_TIMEOUT_MS: "3300000"
      E2E_BIOMNI_RUN_TIMEOUT_MS: "4800000"
      LLM_BACKEND: openai
      OPENAI_BASE_URL: ${{ vars.E2E_JUDGE_BASE_URL }}
      OPENAI_API_KEY: ${{ secrets.E2E_JUDGE_TOKEN }}
      RACE_MODEL: ${{ vars.E2E_JUDGE_MODEL }}
      CLEAN_MODEL: ${{ vars.E2E_JUDGE_MODEL }}
      FACT_MODEL: ${{ vars.E2E_JUDGE_MODEL }}
      BIOMNI_JUDGE_BASE_URL: ${{ vars.E2E_JUDGE_BASE_URL }}
      BIOMNI_JUDGE_MODEL: ${{ vars.E2E_JUDGE_MODEL }}
      BIOMNI_JUDGE_API_KEY: ${{ secrets.E2E_JUDGE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      # Observation only, for the exit report's memory column. Samples the VM's
      # used memory (MemTotal - MemAvailable, so reclaimable cache is excluded)
      # every 5 s for the whole worker, and keeps the steps' cgroup for its
      # memory.peak, which does include page cache.
      - name: Start the worker memory sampler
        continue-on-error: true
        run: |
          mkdir -p .ci-memory
          sed -n 's/^0:://p' /proc/self/cgroup > .ci-memory/cgroup.txt
          nohup bash -c 'while :; do awk -v now="$(date +%s)" "/^MemTotal:/{t=\$2} /^MemAvailable:/{a=\$2} /^SwapTotal:/{st=\$2} /^SwapFree:/{sf=\$2} END{print now, t-a, st-sf}" /proc/meminfo; sleep 5; done' >> .ci-memory/samples.txt 2>/dev/null &
          echo $! > .ci-memory/sampler.pid
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Prepare real-research prerequisites (no model calls)
        if: ${{ matrix.shard != 'basic' }}
        run: bash .ci/prepare-real-research.sh
      - name: Provision sandbox
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap
          sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --ro-bind / / --dev /dev true
      - name: Run the frozen real E2E shard
        run: pnpm ci:e2e:real -- --profile "$CI_PROFILE" --shard "$CI_REAL_SHARD"
      - name: Summarize actual planned and executed cases
        if: always()
        run: node .ci/tagged-summary.mjs
      - name: Stage real E2E scores
        if: always()
        run: node .ci/prepare-real-e2e-results.mjs
      - name: Summarize worker memory
        if: always()
        continue-on-error: true
        run: |
          kill "$(cat .ci-memory/sampler.pid 2>/dev/null)" 2>/dev/null || true
          cgroup="/sys/fs/cgroup$(cat .ci-memory/cgroup.txt 2>/dev/null)"
          {
            echo "cgroup=${cgroup}"
            echo "cgroup_memory_peak_bytes=$(cat "${cgroup}/memory.peak" 2>/dev/null || echo unavailable)"
            echo "cgroup_memory_events=$(tr '\n' ' ' < "${cgroup}/memory.events" 2>/dev/null || echo unavailable)"
            echo "mem_total_kib=$(awk '/^MemTotal:/{print $2}' /proc/meminfo)"
            awk '{if ($2 > used) used = $2; if ($3 > swap) swap = $3} END {printf "vm_used_peak_kib=%d\nswap_used_peak_kib=%d\nsamples=%d\n", used, swap, NR}' .ci-memory/samples.txt || true
          } | tee .ci-memory/summary.txt
          { echo '### Worker memory'; echo; echo '```'; cat .ci-memory/summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # Names carry the attempt and the run attempt, so a re-run of a failed
      # try adds its artifacts beside the earlier ones instead of hiding them.
      - name: Upload real E2E results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-e2e-results-a${{ matrix.attempt }}-${{ matrix.shard }}-r${{ github.run_attempt }}
          path: .tmp/real-e2e-results
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: Upload real E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-e2e-evidence-a${{ matrix.attempt }}-${{ matrix.shard }}-r${{ github.run_attempt }}
          path: .ci-results
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: Upload worker memory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-e2e-memory-a${{ matrix.attempt }}-${{ matrix.shard }}-r${{ github.run_attempt }}
          path: .ci-memory
          include-hidden-files: true
          if-no-files-found: warn

  real-report:
    name: Account for real cases (attempt ${{ matrix.attempt }})
    needs: [real-plan, real-e2e]
    if: ${{ always() && github.event_name != 'pull_request' }}
    # Each attempt is reconciled against the same frozen plan on its own.
    strategy:
      fail-fast: false
      matrix:
        attempt: ${{ fromJSON(needs.real-plan.outputs.attempts || '[1]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - uses: actions/download-artifact@v4
        with:
          name: real-e2e-plan
          path: .ci-real-plan
      - uses: actions/download-artifact@v4
        with:
          pattern: real-e2e-results-a${{ matrix.attempt }}-*
          path: .ci-real-download
      - name: Keep the latest try of each shard
        run: node .ci/real-attempt.mjs collect "${{ matrix.attempt }}" .ci-real-download .ci-real-results
      - name: Reconcile every planned identity
        run: node .ci/real-report.mjs .ci-real-plan/plan.json .ci-real-results
      - name: Stage combined real E2E scores
        if: always()
        run: node .ci/prepare-real-e2e-results.mjs
      - name: Summarize attempt scores
        if: always()
        run: node .ci/real-attempt.mjs scores .tmp/real-e2e-results
      - name: Upload combined real E2E results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-e2e-attempt-${{ matrix.attempt }}-results
          path: .tmp/real-e2e-results
          overwrite: true
          include-hidden-files: true
          if-no-files-found: warn
      - name: Upload real suite verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-e2e-attempt-${{ matrix.attempt }}-verdict
          path: .ci-real-results/verdict.json
          overwrite: true
          include-hidden-files: true
          if-no-files-found: warn

