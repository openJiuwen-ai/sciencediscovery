# The scheduled build of the default branch. It keeps the packaged binaries it
# produces, stamped with the date and commit so a build can be traced back to
# what went into it. Any other branch runs this workflow only when it is
# dispatched by hand at that ref.
#
# Daily adds real-model E2E to the hermetic merge gate. The reusable workflow
# owns both jobs; the daily profile selects paid journeys from source tags.
#
# The normal start is a workflow_dispatch from the project schedule shortly
# after 16:00 UTC. The cron below is only a fallback: GitHub delays scheduled
# runs by hours, so the guard skips a late cron run when a successful dispatch
# already produced that night's build.

name: Nightly

on:
  schedule:
    # 16:00 UTC is 00:00 the next day in Asia/Shanghai, so the run starts
    # overnight for the team that reads it and has finished by the working
    # morning. GitHub schedules cron only on the default branch, evaluates it
    # in UTC with no daylight-saving adjustment, and drops or delays runs when
    # its queue is busy — the guard below keeps a delayed run from duplicating
    # the dispatch that already started the night.
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A delayed scheduled run waits behind a running dispatch run instead of
  # cancelling it; once the dispatch succeeds, the guard skips the duplicate.
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Decides whether this run is the night's build at all. A dispatch always
  # runs. A scheduled run is the fallback: it only runs when no successful
  # dispatch has been created since the most recent 16:00 UTC boundary.
  guard:
    name: Check for a successful dispatch run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run=true
          if [[ "${GITHUB_EVENT_NAME}" == "schedule" ]]; then
            # The most recent scheduled time: 16:00 UTC today, or yesterday
            # when a delayed run is created before 16:00 UTC.
            now=$(date -u +%s)
            since=$(date -u -d '16:00 today' +%s)
            if (( now < since )); then
              since=$(date -u -d '16:00 yesterday' +%s)
            fi
            since=$(date -u -d "@${since}" +%Y-%m-%dT%H:%M:%SZ)
            # Only a successful dispatch at or after that boundary suppresses
            # the fallback. A failed, cancelled or absent dispatch leaves the
            # scheduled run to do the work. A failing query fails the job: it
            # must not be mistaken for "no dispatch exists". The branch is the
            # current ref, matching the concurrency group above, so a dispatch
            # elsewhere cannot suppress this ref's fallback.
            count=$(gh run list -R "${GITHUB_REPOSITORY}" -b "${GITHUB_REF_NAME}" \
              -w nightly.yml -e workflow_dispatch -s success --created ">=${since}" \
              --limit 1 --json databaseId --jq 'length')
            if (( count > 0 )); then
              run=false
            fi
          fi
          echo "run=${run}" >> "${GITHUB_OUTPUT}"

  # A separate job only because GitHub expressions cannot produce a date, and
  # the version has to be decided before the reusable workflow is called.
  stamp:
    name: Stamp the build
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.stamp.outputs.version }}
    steps:
      - id: stamp
        # The date is the run's own, in the same zone as the cron above, so a
        # build started at 00:00 Asia/Shanghai carries that day. The short SHA
        # is what makes the name resolvable: two nights can share a date, but
        # not a commit.
        run: |
          date=$(TZ=Asia/Shanghai date +%Y%m%d)
          echo "version=nightly-${date}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  gate:
    name: Gate
    needs: [guard, stamp]
    if: needs.guard.outputs.run == 'true'
    uses: ./.github/workflows/ci.yml
    secrets: inherit
    with:
      # Includes real-model and judge cases; PR remains credential-free.
      profile: daily
      release-version: ${{ needs.stamp.outputs.version }}

  # The nightly build is only useful if a failure is visible without opening
  # it, and a scheduled run has no pull request to turn red. This states the
  # outcome of every gate job in the run summary.
  report:
    name: Report the outcome
    needs: [guard, stamp, gate]
    if: always() && needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download case execution details
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: case-execution-details.md
          path: case-execution
      - name: Summarize
        env:
          RESULT: ${{ needs.gate.result }}
          VERSION: ${{ needs.stamp.outputs.version }}
        run: |
          {
            echo "### Nightly ${VERSION}"
            echo
            echo "Gate: **${RESULT}** for \`${GITHUB_SHA}\`"
            echo
            echo "Binaries are attached to this run as \`binary-release-x86_64\`"
            echo "and \`binary-release-aarch64\`. The macOS DMG and ZIP are in \`package-macos-arm64-${GITHUB_SHA}\`."
            if [[ -f case-execution/case-execution-details.md ]]; then
              echo
              cat case-execution/case-execution-details.md
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          # A skipped or cancelled gate is not a pass either; only success is.
          [[ "${RESULT}" == "success" ]]
