# Run the cumulative L5 real E2E profile manually. The optional BiomniBench-DA
# selection is passed to the shared real workflow and defaults to all public tasks.
name: Manual validation

run-name: "Manual validation · ${{ github.ref_name }} · l5 · parallel=${{ inputs.max-parallel }}"

on:
  workflow_dispatch:
    inputs:
      backend:
        description: "E2E execution backend"
        type: choice
        options: [jiuwenswarm, legacy]
        default: jiuwenswarm
      max-parallel:
        description: "Maximum concurrent real E2E workers"
        type: choice
        options: ['1', '2', '4']
        default: '4'
      biomni-case-ids:
        description: "Optional BiomniBench-DA IDs, comma-separated; empty runs all public tasks"
        type: string
        default: ""

concurrency:
  group: manual-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate L5 real E2E
    uses: ./.github/workflows/real-e2e.yml
    secrets: inherit
    with:
      profile: l5
      backend: ${{ inputs.backend }}
      max-parallel: ${{ fromJSON(inputs.max-parallel) }}
      biomni-case-ids: ${{ inputs.biomni-case-ids || '' }}
