# Run L3+L4+L5 real E2E using the existing cumulative l5 profile.
# The complete BiomniBench-DA public-50 corpus and its metrics gate are required.
# This uses shared real-model/judge credentials and may take hours; duration
# depends on case/model latency and the selected worker limit.
# Regular CI cannot cancel this workflow. A newer manual validation at the
# same ref cancels the previous manual run, including any unfinished work.
name: Manual validation

run-name: "Manual validation · ${{ github.ref_name }} · l5 · parallel=${{ inputs.max-parallel }}"

on:
  workflow_dispatch:
    inputs:
      backend:
        description: "E2E execution backend"
        type: choice
        options: [jiuwenswarm, legacy]
        default: jiuwenswarm
      max-parallel:
        description: "Maximum concurrent real E2E workers"
        type: choice
        options: ['1', '2', '4']
        default: '4'

concurrency:
  group: manual-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate L3-L5 real E2E
    uses: ./.github/workflows/real-e2e.yml
    secrets: inherit
    with:
      profile: l5 # Cumulative L3+L4+L5 real slice; full Biomni public-50 required.
      backend: ${{ inputs.backend }}
      max-parallel: ${{ fromJSON(inputs.max-parallel) }}
