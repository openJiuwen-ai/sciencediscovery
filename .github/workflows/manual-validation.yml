# Run the real E2E slice of the existing cumulative L5 profile.
# Keep manual validation separate from regular CI cancellation. A newer
# manual validation at the same ref still replaces the previous manual run.
name: Manual validation

run-name: "Manual validation · ${{ github.ref_name }} · l5 · parallel=${{ inputs.max-parallel }}"

on:
  workflow_dispatch:
    inputs:
      backend:
        description: "E2E execution backend"
        type: choice
        options: [jiuwenswarm, legacy]
        default: jiuwenswarm
      max-parallel:
        description: "Maximum concurrent real E2E workers"
        type: choice
        options: ['1', '2', '4']
        default: '4'

concurrency:
  group: manual-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate L5 real E2E
    uses: ./.github/workflows/real-e2e.yml
    secrets: inherit
    with:
      profile: l5
      backend: ${{ inputs.backend }}
      max-parallel: ${{ fromJSON(inputs.max-parallel) }}
