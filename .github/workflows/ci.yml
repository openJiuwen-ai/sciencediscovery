# UT / ST / E2E plus the two distribution gates (binary release, Docker image)
# on GitHub-hosted Linux runners. The test jobs only call the repository entry
# points documented in .ci/README.md, so CI cannot drift into a second,
# GitHub-only test definition; the distribution jobs build the artifacts a user
# actually receives and then exercise them. Every layer is hermetic: no model
# credentials, no live endpoints, no NPU. The opt-in live layers
# (ci:st:real, ci:e2e:real, ci:st:npu, ci:e2e:legacy) stay out of this file.
#
# The three test jobs below are three slices of one plan, not three suites.
# `ci:ut`, `ci:st` and `ci:e2e` each run `test/support/tagged/shared.mjs`
# against the single selector in `test/support/tagged/profiles.mjs`, narrowed
# by `category`. Those three groups partition the plan,
# so the three jobs together run exactly what `pnpm test:shared` runs on a
# developer's machine — a case cannot be in two jobs or in none. Selection
# reads source tags only; no job's environment, credential or installed
# capability may add or remove a case. A missing capability fails the plan's
# preflight, which fails the job.
#
# `node .ci/tagged-summary.mjs` reads each slice's frozen plan back and fails
# the job unless planned == executed == passed with nothing skipped, including
# when a layer stopped before producing any plan at all.
#
# This file is also the one definition of that gate for the scheduled and
# tagged pipelines: nightly.yml and release.yml call it instead of restating
# its jobs. When their coverage diverges from the merge gate, give this
# workflow an input describing what to run and branch on it here — copying
# jobs into those files is exactly the second test definition the CI contract
# forbids.

name: CI

on:
  push:
    branches: [main, master]
  # These are the activity types GitHub applies by default; naming them keeps
  # the contract visible: every pull request is checked when it is opened,
  # whenever new commits are pushed to it, and if it is reopened.
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
  workflow_call:
    inputs:
      release-version:
        description: >-
          Version stamped into the release binaries and their file names. Left
          empty the packaging script falls back to `git describe`, which on a
          hosted runner's shallow checkout has no tags to describe and yields
          0.0.0 — fine for a gate that only proves the build runs, useless for
          an artifact somebody downloads. Callers that publish or keep the
          output pass a real version.
        type: string
        default: ""
      profile:
        description: >-
          Which CI policy the three test jobs select, from
          `test/support/tagged/profiles.mjs`. `pr` is the merge gate. A
          scheduled or tagged run passes `daily` or `release`, which is held to
          the nightly standard rather than the merge one — today they select
          the same set, and they diverge the moment a live-model or `judge:llm`
          row lands, at which point the caller has to supply that row's
          credentials or the plan fails its preflight.
        type: string
        default: pr

# Keyed on the calling workflow as well as the ref: a nightly run and a push
# run land on refs/heads/main at the same time, and without the workflow name
# they would share a group and cancel each other. In a called workflow
# `github.workflow` is the caller's name, so each pipeline gets its own lane.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  real-e2e:
    name: E2E (real, daily only)
    if: ${{ inputs.profile == 'daily' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: nightly-research
    env:
      CI_ALLOW_REAL: "1"
      CI_RESULTS_DIR: ${{ github.workspace }}/.ci-results
      CI_RUNTIME_DIR: ${{ github.workspace }}/.ci-runtime/real-e2e
      E2E_LLM_BASE_URL: ${{ vars.E2E_LLM_BASE_URL }}
      E2E_LLM_MODEL: ${{ vars.E2E_LLM_MODEL }}
      E2E_LLM_TOKEN: ${{ secrets.E2E_LLM_TOKEN }}
      E2E_JUDGE_BASE_URL: ${{ vars.E2E_JUDGE_BASE_URL }}
      E2E_JUDGE_MODEL: ${{ vars.E2E_JUDGE_MODEL }}
      E2E_JUDGE_TOKEN: ${{ secrets.E2E_JUDGE_TOKEN }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
      E2E_DRB_EVALUATION: full
      E2E_BIOMNI_EVALUATION: rubric
      E2E_DRB_MAX_SUBAGENTS: "2"
      E2E_TEAM_CONCURRENCY_HINT: "2"
      E2E_DRB_RUN_TIMEOUT_MS: "1200000"
      E2E_DRB_EVAL_TIMEOUT_MS: "600000"
      E2E_TEAM_RUN_TIMEOUT_MS: "2400000"
      E2E_BIOMNI_RUN_TIMEOUT_MS: "1200000"
      LLM_BACKEND: openai
      OPENAI_BASE_URL: ${{ vars.E2E_JUDGE_BASE_URL }}
      OPENAI_API_KEY: ${{ secrets.E2E_JUDGE_TOKEN }}
      RACE_MODEL: ${{ vars.E2E_JUDGE_MODEL }}
      CLEAN_MODEL: ${{ vars.E2E_JUDGE_MODEL }}
      FACT_MODEL: ${{ vars.E2E_JUDGE_MODEL }}
      BIOMNI_JUDGE_BASE_URL: ${{ vars.E2E_JUDGE_BASE_URL }}
      BIOMNI_JUDGE_MODEL: ${{ vars.E2E_JUDGE_MODEL }}
      BIOMNI_JUDGE_API_KEY: ${{ secrets.E2E_JUDGE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Prepare real-research prerequisites (no model calls)
        run: bash .ci/prepare-real-research.sh
      - name: Provision sandbox
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap
          sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --ro-bind / / --dev /dev true
      - name: Run the frozen real-E2E daily slice
        run: pnpm ci:e2e:real
      - name: Summarize actual planned and executed cases
        if: always()
        run: node .ci/tagged-summary.mjs
      - name: Upload real E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-e2e-results
          path: .ci-results
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  ut:
    name: UT
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # ut-runner executes real bubblewrap. Ubuntu 24.04 runners ship an
      # AppArmor policy that denies unprivileged user namespaces, which the
      # sandbox needs; without this the Runner tests fail on the host policy
      # rather than on product behaviour.
      - name: Provision the bubblewrap sandbox
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap
          sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --ro-bind / / --dev /dev true
          bwrap --version

      # Agent turns in the UT slice run on JiuwenSwarm: `pnpm ci:ut` wraps the
      # shared runner in scripts/with-jiuwenswarm.sh, which installs the pinned
      # release when missing (about 1.5 GB with its virtualenv), starts one
      # instance and one adapter for the whole run, and stops them afterwards.
      - name: Cache the JiuwenSwarm install
        uses: actions/cache@v4
        with:
          path: |
            .sciencediscovery-data/jiuwenswarm/src
            ~/.local/share/uv/python
          key: jiuwenswarm-${{ runner.os }}-${{ hashFiles('scripts/jiuwenswarm.sh', 'scripts/swarm-patches.py', 'jiuwen_swarm/patches/**') }}

      # The `category:ut` slice, including the tests that drive the real
      # bubblewrap sandbox provisioned above. `--coverage` records coverage in
      # this same execution — per-file Node workers with V8 coverage, pytest
      # with `coverage run` in front — and changes nothing about what is
      # selected. The Coverage job below only merges what this step writes; a
      # release build, which publishes no coverage, does not record it.
      - name: Run UT
        env:
          CI_RESULTS_DIR: ${{ github.workspace }}/.ci-results
          CI_RUNTIME_DIR: ${{ runner.temp }}/ci-runtime
        run: pnpm ci:ut -- --profile ${{ inputs.profile || 'pr' }} ${{ github.workflow != 'Release' && '--coverage' || '' }}

      - name: Report the shared plan
        if: always()
        env:
          CI_RESULTS_DIR: ${{ github.workspace }}/.ci-results
        run: node .ci/tagged-summary.mjs

      - name: Upload UT results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ut-results
          path: |
            .ci-results
            !.ci-results/ut/tagged/coverage
          # .ci-results is itself a dot-directory; by default nothing is uploaded.
          include-hidden-files: true
          if-no-files-found: warn

      # Uploaded even when the run failed: the Coverage job summarises whatever
      # a failed run managed to record and says that it failed, rather than
      # running anything to fill the gap.
      - name: Upload UT coverage data
        if: always() && github.workflow != 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: ut-coverage
          path: .ci-results/ut/tagged/coverage
          # upload-artifact drops dot-files by default; every file here is data.
          include-hidden-files: true
          # A layer that passed has recorded its coverage: finding none means
          # the path is wrong, and the job says so here rather than leaving the
          # Coverage job to fail on an artifact that was never uploaded.
          if-no-files-found: ${{ job.status == 'success' && 'error' || 'warn' }}

  coverage:
    name: Coverage
    # Reports on the UT and ST jobs' own runs and merges them; it executes no
    # test. The mocked browser E2E is not measured. Runs after a failed layer
    # as well, to report what that run uploaded; a cancelled pipeline has
    # nothing to report. Release calls skip it: a tagged build publishes no
    # coverage.
    needs: [ut, st]
    if: ${{ !cancelled() && github.workflow != 'Release' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0

      # A layer that stopped before recording anything uploaded nothing; the
      # summary then says so instead of a download failing the job.
      - name: Download the UT run's coverage data
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ut-coverage
          path: ${{ runner.temp }}/ut-coverage

      - name: Download the ST run's coverage data
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: st-coverage
          path: ${{ runner.temp }}/st-coverage

      - name: Merge coverage
        id: merge
        run: >-
          node scripts/coverage-report.mjs
          --layer "ut=${{ runner.temp }}/ut-coverage" --producer "ut=${{ needs.ut.result }}"
          --layer "st=${{ runner.temp }}/st-coverage" --producer "st=${{ needs.st.result }}"

      - name: Summarize coverage
        if: always()
        env:
          UT_RESULT: ${{ needs.ut.result }}
          ST_RESULT: ${{ needs.st.result }}
        run: node scripts/coverage-job-summary.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Name the summary artifacts
        id: names
        if: always()
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          WORKFLOW: ${{ github.workflow }}
        run: |
          if [[ "$WORKFLOW" == "Nightly" ]]; then scope=nightly
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then scope="pr-${PR_NUMBER}"
          else scope="$EVENT_NAME"; fi
          echo "node=node-coverage-summary-${scope}-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "python=python-coverage-summary-${scope}-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Upload Node.js coverage summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.names.outputs.node }}
          path: |
            coverage/summary.json
            coverage/groups/**/summary.json
          if-no-files-found: warn

      - name: Upload Python coverage summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.names.outputs.python }}
          path: |
            coverage/python/summary.json
            coverage/python/groups/**/summary.json
          if-no-files-found: warn

  st:
    name: ST
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # The hermetic agent loop drives a scripted local endpoint and performs a
      # real workspace tool round trip; no sandbox and no model credential. It
      # runs the API's native agent in process, so `--coverage` records what
      # the loop executes, exactly as it does for UT.
      - name: Run ST
        env:
          CI_RESULTS_DIR: ${{ github.workspace }}/.ci-results
          CI_RUNTIME_DIR: ${{ runner.temp }}/ci-runtime
        run: pnpm ci:st -- --profile ${{ inputs.profile || 'pr' }} ${{ github.workflow != 'Release' && '--coverage' || '' }}

      - name: Report the shared plan
        if: always()
        env:
          CI_RESULTS_DIR: ${{ github.workspace }}/.ci-results
        run: node .ci/tagged-summary.mjs

      - name: Upload ST results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: st-results
          path: |
            .ci-results
            !.ci-results/st/tagged/coverage
          # .ci-results is itself a dot-directory; by default nothing is uploaded.
          include-hidden-files: true
          if-no-files-found: warn

      - name: Upload ST coverage data
        if: always() && github.workflow != 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: st-coverage
          path: .ci-results/st/tagged/coverage
          # upload-artifact drops dot-files by default; every file here is data.
          include-hidden-files: true
          # A layer that passed has recorded its coverage: finding none means
          # the path is wrong, and the job says so here rather than leaving the
          # Coverage job to fail on an artifact that was never uploaded.
          if-no-files-found: ${{ job.status == 'success' && 'error' || 'warn' }}

  e2e:
    name: E2E (mocked, JiuwenSwarm)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Mocked journeys start the product stack, whose Runner executes
      # bubblewrap, and Chromium's own sandbox needs the same capability.
      - name: Provision the bubblewrap sandbox
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap
          sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --ro-bind / / --dev /dev true
          bwrap --version

      # Keyed on the committed E2E lockfile, which pins the only Playwright
      # version .ci/run-e2e.sh is allowed to install.
      - name: Cache the pinned Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('test/e2e.package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-

      # Agent turns run on JiuwenSwarm (Python 3.12, about 1.5 GB with its
      # virtualenv), which run-e2e.sh installs when missing. Keyed on the script
      # and compatibility patches, so a new pin or patch set installs afresh; uv's managed
      # Python is kept too, since the virtualenv points into it.
      - name: Cache the JiuwenSwarm install
        uses: actions/cache@v4
        with:
          path: |
            .sciencediscovery-data/jiuwenswarm/src
            ~/.local/share/uv/python
          key: jiuwenswarm-${{ runner.os }}-${{ hashFiles('scripts/jiuwenswarm.sh', 'scripts/swarm-patches.py', 'jiuwen_swarm/patches/**') }}

      # The `category:e2e` slice. The layer still drives run-e2e.sh, which owns
      # the whole lifecycle: it generates an ephemeral token, starts and stops
      # its own isolated stack on a port block of its own — with agent turns on
      # JiuwenSwarm, run-e2e.sh's default backend — runs the journeys and the
      # JiuwenSwarm checks, and collects reports. What changed is which
      # journeys run and how they are counted: the plan is frozen from the
      # source tags first, and every planned journey must report a pass.
      # E2E_COMMIT_SHA stamps journey reports with the revision under test.
      - name: Run mocked E2E
        env:
          CI_RESULTS_DIR: ${{ github.workspace }}/.ci-results
          CI_RUNTIME_DIR: ${{ runner.temp }}/ci-e2e
          E2E_COMMIT_SHA: ${{ github.sha }}
        run: pnpm ci:e2e -- --profile ${{ inputs.profile || 'pr' }}

      # Playwright exits 0 on skips and produces no results.json at all when
      # the stack never came up, so neither its exit code nor its report can be
      # the verdict here. The frozen plan is: a journey that was planned and
      # did not report a pass fails this step, and so does a missing plan.
      - name: Report the shared plan
        if: always()
        env:
          CI_RESULTS_DIR: ${{ github.workspace }}/.ci-results
        run: node .ci/tagged-summary.mjs

      # run-e2e.sh checks what only the JiuwenSwarm backend does against the
      # same stack after the journeys; their outcome is part of the layer's
      # exit code, and this shows which of them failed.
      - name: Summarize the JiuwenSwarm checks
        if: always()
        run: |
          checks=.ci-results/mocked-standard/e2e/jiuwenswarm-checks.log
          if [[ -f "$checks" ]]; then
            {
              echo
              echo "### JiuwenSwarm checks"
              echo
              echo '```'
              grep -E '^[a-z-]+: |^FAILED|^jiuwenswarm_checks=' "$checks" || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Failure evidence — Playwright report, traces, screenshots, journey
      # reports, and the stack log that attributes a stack-side failure.
      - name: Upload E2E results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: .ci-results
          # .ci-results is itself a dot-directory; by default nothing is uploaded.
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  # The single-file release binaries, each built on its own architecture.
  #
  # The script can cross build, but the four-entry smoke gate can only boot an
  # artifact the host can execute. Building natively means both architectures
  # are gated rather than one shipped unverified, which is what a release
  # binary needs — the gate spawns the packaged bubblewrap runner and exercises
  # the four entry points end to end.
  binary:
    name: Binary release (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      # One architecture failing must not cancel the other: which of the two
      # broke is the first thing worth knowing.
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # zstd compresses the payload; the script checks for it before starting.
      # bubblewrap is what the smoke gate needs, on the same AppArmor terms as
      # the UT job.
      - name: Provision the packaging tools and the sandbox
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends zstd bubblewrap
          sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --ro-bind / / --dev /dev true
          zstd --version

      # The version reaches the VERSION file, the payload manifest and the
      # artifact's own name, so a caller that publishes what comes out has to
      # supply it; a merge-gate run leaves it empty and takes the script's
      # `git describe` default.
      - name: Build both architectures
        env:
          RELEASE_VERSION: ${{ inputs.release-version }}
        run: |
          arguments=(--arch "${{ matrix.arch }}" --output dist/binary-release)
          if [[ -n "${RELEASE_VERSION}" ]]; then
            arguments+=(--version "${RELEASE_VERSION}")
          fi
          bash scripts/package-binary-release.sh "${arguments[@]}"

      - name: Report the artifacts
        if: always()
        run: |
          ls -lh dist/binary-release 2>/dev/null || { echo "no artifacts produced"; exit 0; }
          {
            echo "### Binary release (${{ matrix.arch }})"
            echo
            echo '```'
            ls -lh dist/binary-release
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the release binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binary-release-${{ matrix.arch }}
          path: dist/binary-release
          if-no-files-found: warn
          retention-days: 7

  # Nothing else in this repository builds the product image, and that gap is
  # not hypothetical: a workspace package was renamed and `docker compose build`
  # stayed broken for hundreds of commits, because the only thing that would
  # have noticed was somebody running it by hand.
  #
  # scripts/docker-build-context.test.mjs runs in UT and fails on a Dockerfile
  # COPY source that no longer exists. This job covers what no static read can:
  # the dependency install, the application build, and whether the image that
  # comes out actually serves.
  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # The documented default. Kept in a variable so the same commands can be
      # replayed against a spare port on a machine that already runs a stack.
      SD_PORT: "4310"
    steps:
      - uses: actions/checkout@v4

      # Deliberately uncached. A user's first build is cold, and a cold build is
      # what this job exists to protect; a warm layer cache would hide a broken
      # early stage for as long as the cache survived.
      #
      # The build reaches npm, PyPI, the pinned micromamba release and
      # https://models.dev/api.json. The model catalog snapshot is a hard
      # failure by design, so an outage there stops this job — read the failing
      # stage before assuming the repository broke.
      - name: Build the product image
        run: docker compose build

      # The container carries its own bubblewrap, but the kernel policy it
      # sandboxes under is the host's. Ubuntu 24.04 — what ubuntu-latest is —
      # ships kernel.apparmor_restrict_unprivileged_userns=1, and a restricted
      # unprivileged user namespace is created without the capabilities its
      # owner normally holds, so bubblewrap gets as far as its own network
      # namespace and then cannot bring up loopback:
      #
      #   bwrap: loopback: Failed RTM_NEWADDR: Operation not permitted
      #
      # `security_opt: apparmor=unconfined` does not cover this: it governs the
      # container's profile, not the host-wide restriction. The UT, ST, E2E and
      # binary jobs all clear the same switch before touching the sandbox; this
      # job needs it for the same reason, one layer down.
      - name: Allow the sandbox's user namespaces on the host
        run: |
          sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0 || true

      # The documented first-run sequence: copy the example .env, name the
      # invoking user's ids in it (a hosted runner is not uid 1000, and the
      # container writes the bind mount as the ids .env names), create the bind
      # mount as that user, then start. Without the mkdir, Docker creates the
      # directory as root and the entry point exits on an unwritable data
      # directory. SD_PORT goes into the same file so a replay on another port
      # publishes where the job polls.
      - name: Start the stack
        run: |
          cp .env.docker.example .env
          sed -i \
            -e "s/^SCIENCE_AGENT_UID=.*/SCIENCE_AGENT_UID=$(id -u)/" \
            -e "s/^SCIENCE_AGENT_GID=.*/SCIENCE_AGENT_GID=$(id -g)/" \
            -e "s/^SCIENCE_AGENT_PUBLISH_PORT=.*/SCIENCE_AGENT_PUBLISH_PORT=${SD_PORT}/" \
            .env
          mkdir -p data
          docker compose up -d

      - name: Wait for the control API
        run: |
          for _ in $(seq 1 60); do
            curl -fsS "http://127.0.0.1:${SD_PORT}/health" >/dev/null 2>&1 && break
            sleep 5
          done
          curl -fsS "http://127.0.0.1:${SD_PORT}/health" > "${RUNNER_TEMP}/health.json"
          jq . "${RUNNER_TEMP}/health.json"

      # Each check below guards a property the deployment depends on and that a
      # successful build says nothing about.
      - name: Check the deployment contract
        run: |
          fail() { echo "::error::$1"; exit 1; }

          # Compose must derive the container name from the project name. A
          # pinned container_name collides with a second instance on the host.
          name=$(docker compose ps --format '{{.Name}}')
          case "$name" in
            *-sciencediscovery-1) echo "container name: $name" ;;
            *) fail "container name is not project-derived: ${name:-<none>}" ;;
          esac

          # The API answering is not enough; the runner behind it has to be up
          # and report the bubblewrap sandbox.
          health_json="${RUNNER_TEMP}/health.json"
          jq -e '.status == "ok"' "$health_json" >/dev/null || fail "API status is not ok"
          jq -e '.runner.status == "ok"' "$health_json" >/dev/null || fail "runner status is not ok"
          jq -e '.runner.sandbox == "bubblewrap"' "$health_json" >/dev/null || fail "runner does not report the bubblewrap sandbox"

          # That field alone cannot fail a Linux deployment: it reports the
          # configured provider (`executorSandboxKind` returns
          # `sandboxProvider ?? "bubblewrap"`), not the probe's verdict. A
          # container whose sandbox is unusable still answers
          # `"sandbox": "bubblewrap"` with `"status": "ok"`, which is how this
          # job once reported a healthy runner and a broken sandbox in the same
          # breath. The runner does know — it probes at startup and says so on
          # stderr — so read that.
          if docker compose logs sciencediscovery 2>&1 | grep -q "could not build a sandbox"; then
            docker compose logs sciencediscovery 2>&1 | grep -A 12 "could not build a sandbox" >&2 || true
            fail "the runner probed its sandbox at startup and could not build one (see the container log above)"
          fi

          # Compose's own health check, which is what `docker compose ps` shows
          # an operator. start_period is 60s, so allow for it.
          for _ in $(seq 1 40); do
            health=$(docker compose ps --format '{{.Health}}')
            [ "$health" = "healthy" ] && break
            sleep 5
          done
          [ "$health" = "healthy" ] || fail "compose health check never reached healthy (last: ${health:-<none>})"
          echo "compose health: $health"

          # The container is configured by the Compose environment block, never
          # by a .env inside the image. Keys offered by .env.docker.example that
          # nobody forwards are silently dead, so prove one arrived.
          docker compose exec -T sciencediscovery sh -c '[ -n "${SCIENCE_AGENT_CONTEXT_MODE:-}" ]' \
            || fail ".env.docker.example keys are not reaching the container environment"

          # Seeded from the image into the bind-mounted data directory, at the
          # path the Docker guides name.
          test -x data/scientific-envs/bin/micromamba \
            || fail "micromamba was not seeded to data/scientific-envs/bin/micromamba"

          # The real sandbox gate: the argument set packages/sandbox-capability
          # probes with. The outer sh -c is required — as the first process of
          # an exec session bwrap cannot bring up loopback, which fails for
          # reasons unrelated to sandbox capability.
          docker compose exec -T sciencediscovery sh -c '
            bwrap --unshare-all --unshare-user --die-with-parent \
              --ro-bind /usr /usr --symlink usr/bin /bin --symlink usr/lib /lib \
              --symlink usr/lib64 /lib64 --proc /proc /usr/bin/true' \
            || fail "the bubblewrap probe failed inside the container"

          echo "deployment contract OK"

      - name: Report the image
        if: always()
        run: |
          {
            echo "### Docker image"
            echo
            echo '```'
            docker images sciencediscovery --format '{{.Repository}}:{{.Tag}} {{.Size}}' 2>/dev/null
            docker compose ps 2>/dev/null
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect the container logs
        if: always()
        run: docker compose logs --no-color > "${RUNNER_TEMP}/compose-logs.txt" 2>&1 || true

      - name: Upload the container logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-compose-logs
          path: ${{ runner.temp }}/compose-logs.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Stop the stack
        if: always()
        run: docker compose down
