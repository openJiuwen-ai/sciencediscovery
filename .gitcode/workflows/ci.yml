# UT / ST / E2E on GitCode workflows, the counterpart of
# .github/workflows/ci.yml. Both call the same repository entry points
# documented in .ci/README.md, so neither platform can drift into its own test
# definition. Only the hermetic layers run here; ci:st:real, ci:e2e:real,
# ci:st:npu and ci:e2e:legacy need credentials or hardware and stay behind
# their CI_ALLOW_* gates.
#
# `checkout` is the only platform action used. The hosted runner provides
# git, curl, wget, sudo, apt-get, python3, tar and xz on Ubuntu 24.04, running
# as an unprivileged user; it has no node, npm, corepack or bubblewrap. Those
# come from .ci/provision-runner.sh, which prints what it found before it
# installs anything.
#
# Every step needs a `name`: the platform rejects a bare `- uses:` step, which
# a GitHub workflow allows. The checkout lands directly in the working
# directory, so no step changes into a subdirectory. PATH additions are
# re-exported per step because they do not survive the step boundary.
#
# No sandbox can be built on this runner. The job container drops
# CAP_SYS_ADMIN from its bounding set, so neither the job user nor root can
# create a namespace — bubblewrap installs from apt but cannot run, and no
# flavor, container image or `options:` value changes that.
#
# Two consequences shape what runs here:
#   - UT runs ci:ut:core, the repository's own sandbox-free layer: ci:ut minus
#     the @sciencediscovery/runner package, whose tests execute real
#     bubblewrap.
#   - There is no E2E job. `pnpm ci:e2e` starts the full stack, and the Runner
#     refuses to serve when the sandbox is unusable, so the stack never becomes
#     healthy. That is the product declining to execute agent code without
#     isolation, not a CI defect to work around.
#
# Both gaps are covered by .github/workflows/ci.yml, whose runner allows
# unprivileged user namespaces and so runs the full ci:ut and the mocked
# journeys.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets a run be retried from the UI without pushing a commit.
  workflow_dispatch:

jobs:
  ut:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: checkout

      - name: Provision the runner
        run: |
          set -eu
          bash .ci/provision-runner.sh

      - name: Run UT
        run: |
          set -eu
          export PATH="$HOME/.local/node/bin:$HOME/.local/share/pnpm:$HOME/.local/bin:$PATH"
          # Both defaults live inside the .ci image only. The runtime directory
          # stays outside the checkout so the Runner sandbox never mounts over
          # it.
          export CI_RESULTS_DIR="$PWD/.ci-results"
          export CI_RUNTIME_DIR="$HOME/ci-runtime-ut"
          pnpm ci:ut:core

      - name: Report UT results
        run: |
          # No artifact upload action exists here, so the log is the record.
          tail -n 40 .ci-results/ut-core/run.log 2>/dev/null || echo "no run.log produced"

  st:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: checkout

      - name: Provision the runner
        run: |
          set -eu
          bash .ci/provision-runner.sh

      # The hermetic agent loop drives a scripted local endpoint and performs a
      # real workspace tool round trip; no sandbox and no model credential.
      - name: Run ST
        run: |
          set -eu
          export PATH="$HOME/.local/node/bin:$HOME/.local/share/pnpm:$HOME/.local/bin:$PATH"
          export CI_RESULTS_DIR="$PWD/.ci-results"
          export CI_RUNTIME_DIR="$HOME/ci-runtime-st"
          pnpm ci:st

      - name: Report ST results
        run: |
          tail -n 40 .ci-results/st/run.log 2>/dev/null || echo "no run.log produced"

  # The x86_64 release binary only, and deliberately not aarch64.
  #
  # A release binary should be built and gated on the architecture it targets.
  # This pool has no arm64 runner — `runs-on: [ubuntu-latest, arm64, medium]`
  # is accepted and then fails to schedule with HTTP 404 — so an aarch64 build
  # here could only be cross built and never executed. Shipping an unverified
  # artifact is worse than not producing one, so aarch64 is left to
  # .github/workflows/ci.yml, which builds each architecture on its own runner.
  #
  # --skip-smoke because the four-entry gate boots the packaged app, which
  # spawns the bubblewrap runner, and no sandbox can be built in this container.
  # This job therefore proves the packaging pipeline still assembles; GitHub
  # proves the binary runs.
  binary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: checkout

      - name: Provision the runner
        run: |
          set -eu
          bash .ci/provision-runner.sh

      # zstd compresses the payload; the script checks for it before starting.
      - name: Install the packaging tools
        run: |
          set -eu
          if ! command -v zstd >/dev/null 2>&1; then
            if [ "$(id -u)" -eq 0 ]; then apt-get update && apt-get install --yes --no-install-recommends zstd
            else sudo -n apt-get update && sudo -n apt-get install --yes --no-install-recommends zstd
            fi
          fi
          zstd --version

      - name: Build both architectures
        run: |
          set -eu
          export PATH="$HOME/.local/node/bin:$HOME/.local/share/pnpm:$HOME/.local/bin:$PATH"
          bash scripts/package-binary-release.sh --arch x86_64 --skip-smoke --output dist/binary-release

      - name: Report the artifacts
        run: |
          # No artifact upload action exists here, so the sizes are the record.
          ls -lh dist/binary-release 2>/dev/null || echo "no artifacts produced"
