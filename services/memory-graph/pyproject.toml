[project]
name = "sciencediscovery-memory-graph"
version = "0.0.0"
description = "Neo4j sidecar mirroring ScienceDiscovery execution state. The Node control API is its only client. Loopback only."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "httpx>=0.28.0",
    "pydantic>=2.12.5",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sciencediscovery_memory_graph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
