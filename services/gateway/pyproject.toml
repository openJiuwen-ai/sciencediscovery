[project]
name = "science-agent-gateway"
version = "0.0.0"
description = "ScienceDiscovery bundled stdio MCP servers (biomed, UniProt)."
requires-python = ">=3.12"
dependencies = [
    # This package is now only the bundled stdio MCP servers (biomed, UniProt).
    # The agent loop, model clients, MCP client, and web providers all run
    # natively in the Node control plane, so nothing here needs a web
    # framework, an agent framework, or the vendor harness.
    "mcp>=1.0.0",
    "httpx>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/science_agent_gateway"]
