# /etc/nginx/conf.d/sciencediscovery-accounts.conf
#
# TLS terminator for the accounts service on the ECS instance. The Node process
# only listens on 127.0.0.1:4400, so this file is the single public entry.
# Replace accounts.example.com and the certificate paths before enabling.

server {
    listen 80;
    server_name accounts.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name accounts.example.com;

    ssl_certificate     /etc/nginx/ssl/accounts.example.com.pem;
    ssl_certificate_key /etc/nginx/ssl/accounts.example.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 1m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:4400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 之后的 /v1/chat/completions 是 SSE，关掉缓冲才能逐字下发。
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
