[project]
name = "sciencediscovery-idea-tree"
version = "0.0.0"
description = "Independent persistent Idea Tree research service and MCP tools"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115.0", "uvicorn[standard]>=0.34.0", "pydantic>=2.12.5"]

[project.optional-dependencies]
test = ["pytest>=8.0.0", "httpx>=0.28.0"]

[project.scripts]
sciencediscovery-idea-tree = "sciencediscovery_idea_tree.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sciencediscovery_idea_tree"]

[tool.pytest.ini_options]
testpaths = ["tests"]
