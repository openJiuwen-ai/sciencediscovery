[project]
name = "sciencediscovery-hub-api"
version = "0.1.0"
description = "Backend for the ScienceDiscovery asset hub: accounts, uploads, versioning, review, signed downloads."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sqlalchemy>=2.0",
  "pydantic>=2.7",
  "python-multipart>=0.0.9",
  "boto3>=1.34",
  "pymysql>=1.1",
  "cryptography>=42",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
