# The site and its API share one origin: the page reads `/api/v1/...` and never
# needs CORS, and a download's same-origin content endpoint works with the
# browser's save dialog.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 64m;

    location /api/ {
        # A variable plus Docker's resolver defers name resolution to request
        # time: `nginx -t` passes outside the compose network, and an API
        # restart does not leave the proxy pinned to a stale address.
        resolver 127.0.0.11 ipv6=off valid=30s;
        set $hub_api http://api:8100;
        proxy_pass $hub_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Client-side routes resolve to the entry page; real files are served as
    # files. A missing file under a data path must 404 rather than fall back to
    # HTML, which the reader would otherwise render as content.
    location / {
        try_files $uri /index.html;
    }

    location ~ ^/(assets|skills|packages|specialists|connectors)/.+\.(md|json|zip|js|css|png|svg|woff2?)$ {
        try_files $uri =404;
    }
}
