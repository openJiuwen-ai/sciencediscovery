packages:
  - config
  - apps/*
  - services/*
  - packages/*
overrides:
  # @modelcontextprotocol/sdk accepts ^8.17.1 and would otherwise keep the
  # ReDoS-affected 8.17.1 in the tree next to our own pinned 8.18.0.
  ajv: 8.18.0
allowBuilds:
  '@scarf/scarf': true
  # ssh2 works without its optional native helpers, and building them would put
  # a compiler in the install path for no behaviour the product depends on.
  cpu-features: false
  esbuild: true
  ssh2: false
