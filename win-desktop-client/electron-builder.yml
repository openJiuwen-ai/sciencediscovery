# F10 packaging (electron-builder). Design decisions: D1.1 (electron-builder),
# D1.2 (NSIS only), D1.3 (per-user, no UAC), D1.4 (assisted wizard),
# D1.7 (frozen artifact name), D4.1 (license → dir → progress → finish).
# F10.3 clarification (TODO 审查#1): no physical split; the payload tree rides
# extraResources as plain files, so unchanged big pieces keep their blockmap
# blocks and differential updates never re-download them.
appId: cn.sciencediscovery.desktop
productName: ScienceDiscovery
copyright: Apache-2.0

directories:
  output: C:/Users/jiang/AppData/Local/Temp/sd-release
  buildResources: build

# Only the shell code goes into the asar; the backend payload is plain files
# under resources/ (staged by scripts/assemble-backend.mjs).
files:
  - dist/**
  - package.json

extraResources:
  - from: build/resources
    to: .
  - from: build/extra
    to: resources

asarUnpack: []

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ScienceDiscovery
  artifactName: ScienceDiscovery-${version}-win-x64-setup.${ext}
  # F10.6: welcome-page wait expectation + details view (build/installer.nsh).
  include: build/installer.nsh
